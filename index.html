<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SPOT CHECK PRO V4 - FIX MOVIMIENTO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        .nav-container { display: flex; background: #020617; padding: 8px; gap: 4px; shrink: 0; z-index: 1000; }
        .nav-btn {
            flex: 1; padding: 12px 4px; border-radius: 12px; color: #64748b;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s;
        }
        .nav-btn.active { background: #1e293b; color: #10b981; }

        .screen { flex: 1; display: none; overflow: hidden; position: relative; }
        .screen.active { display: flex; flex-direction: column; }

        #viewport {
            flex: 1;
            background: #cbd5e1;
            overflow: auto;
            position: relative;
            padding: 20px;
            display: block;
            -webkit-overflow-scrolling: touch;
        }

        #map-canvas { 
            width: 800px; 
            height: 1500px; 
            background: white;
            position: relative; 
            border-radius: 1rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            margin: 0 auto;
        }

        .mesa {
            position: absolute;
            transform-origin: center;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 14px; user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            z-index: 10;
            touch-action: none; /* Crucial para drag manual */
        }

        .mesa-disponible { background: white; border: 2px solid #cbd5e1; color: #334155; }
        .mesa-ocupada { background: #0f172a; border: 2px solid #0f172a; color: #10b981; }
        .mesa-discrepante { background: #ef4444; border: 2px solid #b91c1c; color: white; }
        .mesa-vip { border-color: #f59e0b !important; border-width: 3px !important; }

        .resize-handle {
            position: absolute;
            right: -12px;
            bottom: -12px;
            width: 36px;
            height: 36px;
            background: #3b82f6;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            z-index: 150;
            cursor: nwse-resize;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            touch-action: none;
        }

        .edit-bubble {
            position: absolute; top: -85px; left: 50%; transform: translateX(-50%);
            background: #0f172a; border-radius: 14px; padding: 8px;
            display: flex; gap: 8px; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .edit-bubble button { 
            color: white; width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
            background: rgba(255,255,255,0.1);
        }

        .input-field { 
            width: 100%; padding: 12px; border-radius: 12px; 
            border: 2px solid #e2e8f0; font-weight: 700; outline: none;
        }
        
        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(150px);
            background: #0f172a; color: white; padding: 12px 24px; border-radius: 20px;
            font-weight: 800; font-size: 11px; z-index: 2000; transition: 0.3s;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        .bottom-controls {
            background: white; padding: 16px; border-top: 1px solid #e2e8f0; shrink: 0;
            z-index: 500;
        }

        .btn-audit-floating {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 900;
        }
    </style>
</head>
<body>

    <header class="bg-slate-950 p-4 pt-8 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-layer-group text-slate-900 text-sm"></i>
            </div>
            <span class="text-white font-black italic tracking-tighter uppercase">Spot Check V4</span>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-black tracking-widest border border-slate-700 active:scale-95 transition-transform">
            <i id="lock-icon" class="fa-solid fa-lock text-red-500 mr-1"></i> <span id="lock-text">LOCK</span>
        </button>
    </header>

    <nav class="nav-container">
        <button onclick="setTab('design')" id="nav-design" class="nav-btn active"><i class="fa-solid fa-pen-ruler text-lg"></i>Diseño</button>
        <button onclick="setTab('audit')" id="nav-audit" class="nav-btn"><i class="fa-solid fa-check-double text-lg"></i>Auditoría</button>
        <button onclick="setTab('notes')" id="nav-notes" class="nav-btn"><i class="fa-solid fa-edit text-lg"></i>Notas</button>
        <button onclick="setTab('reports')" id="nav-reports" class="nav-btn"><i class="fa-solid fa-list-ul text-lg"></i>Reportes</button>
    </nav>

    <section id="screen-design" class="screen active">
        <div id="viewport" onclick="deselectAll(event)">
            <div id="map-canvas">
                <div id="layer-design" class="w-full h-full relative"></div>
            </div>
        </div>
        <div id="design-controls" class="hidden bottom-controls grid grid-cols-2 gap-2">
            <button onclick="addTable('std')" class="bg-slate-900 text-white p-4 rounded-xl font-black text-[10px] uppercase">
                <i class="fa-solid fa-square mr-1"></i> + Estándar
            </button>
            <button onclick="addTable('vip')" class="bg-amber-500 text-white p-4 rounded-xl font-black text-[10px] uppercase">
                <i class="fa-solid fa-crown mr-1"></i> + VIP Rect.
            </button>
        </div>
    </section>

    <section id="screen-audit" class="screen">
        <div id="viewport">
            <div id="map-canvas">
                <div id="layer-audit" class="w-full h-full relative"></div>
            </div>
        </div>
        <div class="btn-audit-floating">
            <button onclick="setTab('notes')" class="w-full bg-emerald-500 text-white p-5 rounded-3xl font-black uppercase text-xs shadow-2xl border-4 border-white/20">
                Confirmar y Ver Planilla <i class="fa-solid fa-chevron-right ml-2"></i>
            </button>
        </div>
    </section>

    <section id="screen-notes" class="screen overflow-y-auto p-6 bg-slate-100">
        <div class="max-w-md mx-auto bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-200">
            <h2 class="text-xs font-black uppercase text-slate-400 mb-6 tracking-widest italic border-b pb-2">Planilla de Auditoría</h2>
            <div class="space-y-4">
                <input type="text" id="mesas-registradas" placeholder="MESAS REGISTRADAS" class="input-field uppercase">
                <input type="text" id="lugar-sector" placeholder="SECTOR" class="input-field uppercase">
                <input type="text" id="mesas-insitu" placeholder="MESAS OCUPADAS (IN SITU)" class="input-field uppercase">
                <input type="text" id="mesas-micros" placeholder="MESAS MICROS" class="input-field uppercase">
                <input type="time" id="hora-control" class="input-field">
                <textarea id="obs-final" rows="3" placeholder="OBSERVACIONES..." class="input-field uppercase"></textarea>
                <input type="text" id="firma-auditor" placeholder="FIRMA AUDITOR" class="input-field uppercase">
            </div>
            <button onclick="saveFinalReport()" class="w-full mt-6 bg-slate-900 text-white p-5 rounded-3xl font-black uppercase text-xs">
                Finalizar y Guardar Reporte
            </button>
        </div>
    </section>

    <section id="screen-reports" class="screen overflow-y-auto p-6">
        <div id="report-list" class="space-y-3 pb-20"></div>
    </section>

    <div id="toast">MENSAJE</div>

    <script>
        let tables = JSON.parse(localStorage.getItem('sp_v4_tables')) || [];
        let reports = JSON.parse(localStorage.getItem('sp_v4_reports')) || [];
        let auditStatus = {}; 
        let isLocked = true;
        let draggingId = null;
        let resizingId = null;
        let selectedId = null;
        let currentTab = 'design';

        let initialX, initialY, initialW, initialH;

        function init() { renderAll(); }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
            selectedId = null;
            renderAll();
        }

        function renderAll() {
            renderMap('layer-design', false);
            renderMap('layer-audit', true);
            renderReports();
            const controls = document.getElementById('design-controls');
            if(controls) controls.classList.toggle('hidden', isLocked || currentTab !== 'design');
        }

        function renderMap(layerId, isAudit) {
            const layer = document.getElementById(layerId);
            if (!layer) return;
            layer.innerHTML = '';

            tables.forEach(t => {
                const div = document.createElement('div');
                const status = auditStatus[t.id] || 0; 
                
                div.className = `mesa ${isAudit ? (status === 1 ? 'mesa-ocupada' : (status === 2 ? 'mesa-discrepante' : 'mesa-disponible')) : 'mesa-disponible'} ${t.tipo === 'vip' ? 'mesa-vip' : ''}`;
                div.style.left = t.x + 'px';
                div.style.top = t.y + 'px';
                div.style.width = t.w + 'px';
                div.style.height = t.h + 'px';
                div.style.transform = `translate(-50%, -50%) rotate(${t.r || 0}deg)`;
                div.innerText = t.label;

                if (isAudit) {
                    div.onclick = (e) => { 
                        e.stopPropagation();
                        auditStatus[t.id] = (status + 1) % 3;
                        renderMap(layerId, true); 
                    };
                } else {
                    // EVENTOS DE LA MESA (SELECCIONAR Y MOVER)
                    div.onpointerdown = (e) => {
                        if (isLocked) return;
                        if (!e.isPrimary) return;
                        
                        // Si tocamos el tirador azul, no iniciamos el arrastre de la mesa
                        if (e.target.closest('.resize-handle')) return;

                        selectedId = t.id;
                        draggingId = t.id;
                        
                        const rect = layer.getBoundingClientRect();
                        // Calculamos el offset desde el centro de la mesa (donde está el ancla)
                        initialX = (e.clientX - rect.left) - t.x;
                        initialY = (e.clientY - rect.top) - t.y;
                        
                        div.setPointerCapture(e.pointerId);
                        e.stopPropagation();
                        renderAll();
                    };

                    div.onpointermove = (e) => {
                        if (draggingId === t.id && !resizingId) {
                            const rect = layer.getBoundingClientRect();
                            t.x = (e.clientX - rect.left) - initialX;
                            t.y = (e.clientY - rect.top) - initialY;
                            div.style.left = t.x + 'px';
                            div.style.top = t.y + 'px';
                        }
                    };

                    div.onpointerup = (e) => { 
                        draggingId = null; 
                        save(); 
                    };

                    // UI DE EDICIÓN
                    if (selectedId === t.id && !isLocked) {
                        div.style.border = '3px solid #3b82f6';
                        div.style.zIndex = '100';
                        
                        const bubble = document.createElement('div');
                        bubble.className = 'edit-bubble';
                        bubble.innerHTML = `
                            <button onclick="rotate(${t.id})"><i class="fa-solid fa-rotate-right"></i></button>
                            <button onclick="rename(${t.id})"><i class="fa-solid fa-font"></i></button>
                            <button onclick="deleteT(${t.id})"><i class="fa-solid fa-trash-can text-red-400"></i></button>
                        `;
                        div.appendChild(bubble);

                        // TIRADOR DE REDIMENSIONAR MEJORADO
                        const handle = document.createElement('div');
                        handle.className = 'resize-handle';
                        handle.innerHTML = '<i class="fa-solid fa-expand"></i>';
                        
                        handle.onpointerdown = (e) => {
                            e.stopPropagation();
                            resizingId = t.id;
                            initialW = t.w;
                            initialH = t.h;
                            initialX = e.clientX;
                            initialY = e.clientY;
                            handle.setPointerCapture(e.pointerId);
                        };

                        handle.onpointermove = (e) => {
                            if (resizingId === t.id) {
                                e.stopPropagation();
                                const dx = e.clientX - initialX;
                                const dy = e.clientY - initialY;
                                // Permite achicar y agrandar libremente
                                t.w = Math.max(20, initialW + dx);
                                t.h = Math.max(20, initialH + dy);
                                div.style.width = t.w + 'px';
                                div.style.height = t.h + 'px';
                            }
                        };

                        handle.onpointerup = (e) => { 
                            resizingId = null; 
                            save(); 
                            renderAll(); // Re-render para limpiar estados
                        };
                        div.appendChild(handle);
                    }
                }
                layer.appendChild(div);
            });
        }

        function toggleLock() {
            isLocked = !isLocked;
            const icon = document.getElementById('lock-icon');
            const text = document.getElementById('lock-text');
            icon.className = isLocked ? 'fa-solid fa-lock text-red-500 mr-1' : 'fa-solid fa-unlock text-emerald-500 mr-1';
            text.innerText = isLocked ? 'LOCK' : 'EDIT';
            selectedId = null;
            showToast(isLocked ? "SISTEMA BLOQUEADO" : "MODO EDICIÓN ACTIVADO");
            renderAll();
        }

        function rotate(id) {
            const t = tables.find(x => x.id === id);
            t.r = (t.r || 0) + 45;
            save(); renderAll();
        }

        function rename(id) {
            const t = tables.find(x => x.id === id);
            const n = prompt("Nombre:", t.label);
            if(n) t.label = n.toUpperCase();
            save(); renderAll();
        }

        function deleteT(id) {
            tables = tables.filter(x => x.id !== id);
            selectedId = null;
            save(); renderAll();
        }

        function deselectAll(e) { 
            if (['layer-design', 'viewport', 'map-canvas'].includes(e.target.id)) {
                selectedId = null; renderAll(); 
            }
        }

        function addTable(tipo) {
            const viewport = document.getElementById('viewport');
            const spawnY = viewport.scrollTop + 200;
            tables.push({ 
                id: Date.now(), x: 200, y: spawnY, w: 100, h: 60, r: 0, 
                label: (tables.length + 1).toString(), tipo: tipo 
            });
            save(); renderAll();
        }

        function save() { localStorage.setItem('sp_v4_tables', JSON.stringify(tables)); }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function saveFinalReport() {
            const report = {
                id: Date.now(),
                firma: document.getElementById('firma-auditor').value.toUpperCase() || "AUDITOR",
                resumen: `Sector: ${document.getElementById('lugar-sector').value} | Ocup: ${document.getElementById('mesas-insitu').value}`,
                detalle: `Obs: ${document.getElementById('obs-final').value}`,
                hora: document.getElementById('hora-control').value,
                date: new Date().toLocaleDateString()
            };
            reports.unshift(report);
            localStorage.setItem('sp_v4_reports', JSON.stringify(reports));
            showToast("REPORTE GUARDADO");
            renderReports();
            setTab('reports');
        }

        function renderReports() {
            const list = document.getElementById('report-list');
            if(!list) return;
            list.innerHTML = reports.map(r => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <p class="font-black text-[11px] text-slate-900 uppercase">${r.firma} - ${r.date}</p>
                    <p class="text-[10px] text-slate-600 font-bold">${r.resumen}</p>
                    <p class="text-[9px] text-slate-400 italic">${r.detalle}</p>
                </div>
            `).join('') || '<div class="text-center py-10 text-slate-300 font-black text-[10px] uppercase">Sin reportes</div>';
        }

        window.onload = init;
    </script>
</body>
</html>
