<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>SPOT CHECK V10 - SISTEMA PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --accent: #fbbf24;
            --danger: #ef4444;
            --success: #10b981;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            overscroll-behavior: none; 
            background-color: #0f172a;
            color: white;
            user-select: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        #viewport {
            flex: 1;
            overflow: hidden;
            touch-action: none;
            position: relative;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }

        #map-container { 
            height: 3000px; 
            width: 4000px;
            position: absolute;
            background-color: #ffffff;
            transform-origin: 0 0;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        .design-grid {
            background-image: 
                linear-gradient(to right, #f1f5f9 2px, transparent 2px),
                linear-gradient(to bottom, #f1f5f9 2px, transparent 2px);
            background-size: 100px 100px;
        }

        /* MESA ESTILO V10 */
        .mesa {
            position: absolute;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            touch-action: none;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            border: 4px solid rgba(255,255,255,0.4);
            border-radius: 16px;
            transition: transform 0.1s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* CONTROL TÁCTIL GIGANTE V10 */
        .resizer-v10 {
            position: absolute;
            width: 60px; /* Tamaño grande para dedos */
            height: 60px;
            right: -30px;
            bottom: -30px;
            background: #f59e0b;
            border: 5px solid #ffffff;
            border-radius: 50%;
            display: none;
            z-index: 100;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .edit-mode .mesa.selected .resizer-v10 {
            display: flex;
        }

        .mesa.selected { 
            outline: 6px solid #6366f1;
            outline-offset: 6px;
            z-index: 50;
            transform: scale(1.05);
        }

        .status-free { background: #10b981; }
        .status-busy { background: #ef4444; }
        .status-clean { background: #f59e0b; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <!-- NAVBAR V10 -->
    <header class="p-4 bg-slate-900 flex items-center justify-between z-50 border-b-4 border-indigo-500">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 px-3 py-1 rounded shadow-lg">
                <span class="font-black text-xl italic">V10</span>
            </div>
            <div>
                <h1 class="font-black uppercase italic text-lg leading-tight">Spot Check</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Pro Touch Engine</p>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button onclick="toggleEditMode()" id="mode-btn" class="bg-indigo-600 px-6 py-2 rounded-full font-black text-xs uppercase shadow-xl active:scale-95 transition-all">
                <i class="fas fa-hammer mr-2"></i>Editar
            </button>
            <button onclick="openHistory()" class="bg-slate-800 w-12 h-12 rounded-full flex items-center justify-center shadow-lg active:scale-95">
                <i class="fas fa-history text-lg"></i>
            </button>
        </div>
    </header>

    <main id="viewport">
        <div id="map-container" class="design-grid"></div>

        <!-- Botones Flotantes de Construcción -->
        <div id="builder-ui" class="absolute left-6 top-6 hidden flex-col gap-4 z-40">
            <button onclick="addNewTable()" class="glass-panel p-6 rounded-3xl flex flex-col items-center gap-2 border-l-8 border-indigo-500 shadow-2xl active:scale-90">
                <i class="fas fa-plus text-3xl text-indigo-400"></i>
                <span class="text-[10px] font-black uppercase">Añadir</span>
            </button>
            <button onclick="saveToStorage()" class="glass-panel p-5 rounded-3xl flex flex-col items-center gap-2 border-l-8 border-emerald-500 shadow-xl active:scale-90">
                <i class="fas fa-save text-2xl text-emerald-400"></i>
                <span class="text-[10px] font-black uppercase tracking-widest">Guardar</span>
            </button>
        </div>

        <!-- Controles de Navegación -->
        <div class="absolute bottom-10 right-6 flex flex-col gap-4 z-40">
            <div class="glass-panel p-2 rounded-full flex flex-col gap-2 shadow-2xl">
                <button onclick="zoom(0.2)" class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center text-2xl active:bg-indigo-500"><i class="fas fa-plus"></i></button>
                <button onclick="zoom(-0.2)" class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center text-2xl active:bg-indigo-500"><i class="fas fa-minus"></i></button>
            </div>
            <button onclick="resetZoom()" class="w-16 h-16 bg-indigo-600 rounded-3xl shadow-2xl flex items-center justify-center text-2xl active:scale-90"><i class="fas fa-compress-arrows-alt"></i></button>
        </div>
    </main>

    <!-- MODAL AUDITORÍA -->
    <div id="audit-modal" class="modal">
        <div class="glass-panel w-full max-w-md rounded-[40px] p-8 shadow-2xl border-t-8 border-indigo-500">
            <h2 id="audit-title" class="text-3xl font-black italic uppercase mb-6 text-indigo-400 text-center">Auditoría</h2>
            
            <div class="grid grid-cols-2 gap-6 mb-8">
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase ml-2">In Situ</label>
                    <input type="number" id="audit-insitu" class="w-full bg-slate-800 border-2 border-slate-700 p-5 rounded-2xl font-black text-3xl text-center focus:border-indigo-500 transition-colors">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase ml-2">Micros</label>
                    <input type="number" id="audit-micros" class="w-full bg-slate-800 border-2 border-slate-700 p-5 rounded-2xl font-black text-3xl text-center focus:border-indigo-500 transition-colors">
                </div>
            </div>

            <div class="space-y-2 mb-8">
                <label class="text-xs font-black text-slate-400 uppercase ml-2">Observaciones</label>
                <textarea id="audit-obs" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl h-24 focus:border-indigo-500 transition-colors" placeholder="¿Alguna nota extra?"></textarea>
            </div>
            
            <div class="flex gap-4">
                <button onclick="closeModal('audit-modal')" class="flex-1 bg-slate-800 p-5 rounded-2xl font-black uppercase text-xs tracking-widest">Cerrar</button>
                <button onclick="confirmAudit()" class="flex-1 bg-indigo-600 p-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95">Registrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL HISTORIAL -->
    <div id="history-modal" class="modal">
        <div class="glass-panel w-full max-w-lg h-[85vh] rounded-[40px] p-8 flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black uppercase italic text-indigo-400">Historial de Hoy</h2>
                <button onclick="closeModal('history-modal')" class="text-slate-400 text-4xl">&times;</button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar">
                <!-- Se llena con JS -->
            </div>
            <button onclick="clearAllData()" class="mt-6 text-rose-500 font-black text-[10px] uppercase tracking-[0.2em] self-center py-2 opacity-50 hover:opacity-100">Borrar Todo</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "SPOTCHECK_V10_PRO";
        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            tables: [{ id: 1, x: 200, y: 200, w: 150, h: 150, label: "01", status: "free" }],
            logs: []
        };

        let editMode = false;
        let selectedId = null;
        let scale = 0.6, tx = 50, ty = 50;
        const container = document.getElementById('map-container');
        const viewport = document.getElementById('viewport');

        function render() {
            container.innerHTML = '';
            document.body.classList.toggle('edit-mode', editMode);

            state.tables.forEach(t => {
                const el = document.createElement('div');
                el.className = `mesa status-${t.status} ${selectedId === t.id ? 'selected' : ''}`;
                el.style.cssText = `left:${t.x}px; top:${t.y}px; width:${t.w}px; height:${t.h}px;`;
                
                el.innerHTML = `
                    <span class="text-3xl">${t.label}</span>
                    <div class="resizer-v10" data-role="resize">
                        <i class="fas fa-expand-alt text-2xl text-white"></i>
                    </div>
                `;

                el.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    const isResize = e.target.closest('[data-role="resize"]');
                    selectedId = t.id;
                    render();

                    if (!editMode) {
                        handleMesaTap(t);
                        return;
                    }

                    const startX = e.clientX;
                    const startY = e.clientY;
                    const initialW = t.w;
                    const initialH = t.h;
                    const initialX = t.x;
                    const initialY = t.y;

                    const onMove = (m) => {
                        const dx = (m.clientX - startX) / scale;
                        const dy = (m.clientY - startY) / scale;

                        if (isResize) {
                            t.w = Math.max(100, initialW + dx);
                            t.h = Math.max(100, initialH + dy);
                        } else {
                            t.x = initialX + dx;
                            t.y = initialY + dy;
                        }
                        el.style.left = t.x + 'px';
                        el.style.top = t.y + 'px';
                        el.style.width = t.w + 'px';
                        el.style.height = t.h + 'px';
                    };

                    const onUp = () => {
                        window.removeEventListener('pointermove', onMove);
                        window.removeEventListener('pointerup', onUp);
                        saveToStorage();
                    };

                    window.addEventListener('pointermove', onMove);
                    window.addEventListener('pointerup', onUp);
                });

                container.appendChild(el);
            });
        }

        let activeTable = null;
        function handleMesaTap(table) {
            activeTable = table;
            document.getElementById('audit-title').innerText = `Mesa ${table.label}`;
            document.getElementById('audit-insitu').value = 0;
            document.getElementById('audit-micros').value = 0;
            document.getElementById('audit-obs').value = "";
            document.getElementById('audit-modal').classList.add('active');
        }

        function confirmAudit() {
            const log = {
                id: Date.now(),
                mesa: activeTable.label,
                insitu: document.getElementById('audit-insitu').value,
                micros: document.getElementById('audit-micros').value,
                obs: document.getElementById('audit-obs').value,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            state.logs.unshift(log);
            activeTable.status = 'busy';
            saveToStorage(); render(); closeModal('audit-modal');
        }

        function openHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = state.logs.map(l => `
                <div class="bg-white/5 p-6 rounded-3xl border border-white/10 shadow-lg">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-[10px] font-black text-indigo-400 uppercase tracking-widest block">Mesa</span>
                            <span class="text-2xl font-black italic">${l.mesa}</span>
                        </div>
                        <span class="bg-slate-800 px-3 py-1 rounded-full text-[10px] font-bold text-slate-400">${l.time}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 bg-black/20 p-4 rounded-2xl mb-3">
                        <div>
                            <span class="text-[8px] font-bold text-slate-500 uppercase block">In Situ</span>
                            <span class="text-xl font-black">${l.insitu}</span>
                        </div>
                        <div>
                            <span class="text-[8px] font-bold text-slate-500 uppercase block">Micros</span>
                            <span class="text-xl font-black">${l.micros}</span>
                        </div>
                    </div>
                    ${l.obs ? `<div class="text-xs text-slate-400 italic bg-white/5 p-3 rounded-xl">"${l.obs}"</div>` : ''}
                </div>
            `).join('') || '<div class="text-center py-20 text-slate-600 font-black uppercase text-xs">Sin registros hoy</div>';
            document.getElementById('history-modal').classList.add('active');
        }

        function toggleEditMode() {
            editMode = !editMode;
            const btn = document.getElementById('mode-btn');
            btn.innerHTML = editMode ? '<i class="fas fa-check mr-2"></i>Listo' : '<i class="fas fa-hammer mr-2"></i>Editar';
            btn.className = editMode ? 'bg-emerald-600 px-6 py-2 rounded-full font-black text-xs uppercase shadow-xl' : 'bg-indigo-600 px-6 py-2 rounded-full font-black text-xs uppercase shadow-xl';
            document.getElementById('builder-ui').style.display = editMode ? 'flex' : 'none';
            selectedId = null;
            render();
        }

        function addNewTable() {
            const name = prompt("Número o nombre de mesa:", `M${state.tables.length + 1}`);
            if (name) {
                const id = Date.now();
                state.tables.push({ id, x: 500, y: 500, w: 150, h: 150, label: name, status: "free" });
                selectedId = id;
                saveToStorage(); render();
            }
        }

        function clearAllData() { if(confirm("¿Seguro que quieres borrar todas las mesas y el historial?")) { localStorage.clear(); location.reload(); } }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function zoom(v) { scale = Math.min(Math.max(scale + v, 0.15), 2.5); apply(); }
        function resetZoom() { scale = 0.6; tx = 50; ty = 50; apply(); }
        function apply() { container.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
        function saveToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

        // Navegación de cámara
        let isPanning = false, startX, startY;
        viewport.onpointerdown = (e) => {
            if (e.target === viewport || e.target === container) {
                isPanning = true;
                startX = e.clientX - tx; startY = e.clientY - ty;
                selectedId = null; render();
            }
        };
        window.onpointermove = (e) => { if (isPanning) { tx = e.clientX - startX; ty = e.clientY - startY; apply(); } };
        window.onpointerup = () => isPanning = false;

        render(); apply();
    </script>
</body>
</html>
