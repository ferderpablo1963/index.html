<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - EDITOR RÁPIDO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f1f5f9;
        }
        
        #map-wrapper {
            width: 100%;
            height: 100%;
            overflow: auto;
            position: relative;
            background-color: #cbd5e1;
        }

        #map-container { 
            height: 1200px; 
            width: 1000px; 
            position: relative;
            background-color: #ffffff;
            transform-origin: 0 0;
            transition: transform 0.2s ease-out;
        }

        /* Rejilla más visible para alinear fácil */
        .design-grid {
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .mesa {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 20;
            touch-action: none;
            cursor: pointer;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .area-vip {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 10;
            border: 2px dashed #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            text-transform: uppercase;
            touch-action: none;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
        }

        .item-free { background-color: #ffffff; color: #1e293b; border: 2px solid #e2e8f0; }
        .item-occupied { 
            background-color: #0f172a !important; 
            color: #ffffff !important; 
            border-color: #0f172a !important;
        }

        .selected-design { 
            outline: 4px solid #3b82f6; 
            outline-offset: 2px; 
            z-index: 50 !important; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* Botones laterales de Zoom */
        .zoom-bar {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .zoom-btn {
            width: 44px;
            height: 44px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: #475569;
            font-size: 18px;
        }

        /* Panel de herramientas rápido (Flotante) */
        .fab-container {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 130;
        }

        .fab-add {
            padding: 12px 20px;
            background: #0f172a;
            color: white;
            border-radius: 20px;
            font-weight: 900;
            font-size: 11px;
            text-transform: uppercase;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-900">

    <!-- CABECERA -->
    <header class="bg-slate-950 text-white p-4 pt-10 flex justify-between items-center shrink-0 z-[140]">
        <div class="flex items-center gap-2">
            <h1 class="font-black text-lg italic tracking-tighter uppercase">SPOT CHECK</h1>
        </div>
        <div id="design-edit-top" class="hidden flex items-center gap-2 bg-blue-600 px-3 py-1.5 rounded-full animate-in fade-in">
            <input id="label-input" type="text" class="w-20 bg-transparent text-white font-bold outline-none border-b border-blue-400 text-sm" placeholder="Mesa...">
            <button onclick="rotateSelected()" id="rotate-btn" class="p-1 text-white"><i class="fa-solid fa-rotate"></i></button>
            <button onclick="deleteSelected()" class="p-1 text-white"><i class="fa-solid fa-trash-can"></i></button>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center border border-slate-800">
            <i class="fa-solid fa-lock text-red-500" id="lock-icon"></i>
        </button>
    </header>

    <!-- NAVEGACIÓN -->
    <nav class="bg-white border-b border-slate-200 p-2 flex gap-1 z-[140]">
        <button onclick="setMode('audit')" id="nav-audit" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-slate-950 text-white shadow-lg transition-all">Auditar</button>
        <button onclick="setMode('design')" id="nav-design" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400 transition-all">Diseño</button>
        <button onclick="setMode('history')" id="nav-history" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400 transition-all">Reportes</button>
    </nav>

    <!-- CONTROLES ZOOM -->
    <div class="zoom-bar">
        <button onclick="changeZoom(0.2)" class="zoom-btn active:scale-90"><i class="fa-solid fa-plus"></i></button>
        <button onclick="changeZoom(-0.2)" class="zoom-btn active:scale-90"><i class="fa-solid fa-minus"></i></button>
        <button onclick="resetZoom()" class="zoom-btn text-[9px] font-bold">1:1</button>
    </div>

    <!-- BOTONES RÁPIDOS DE CREACIÓN (SOLO EN DISEÑO) -->
    <div id="design-fabs" class="fab-container hidden">
        <button onclick="addTable()" class="fab-add bg-slate-900">
            <i class="fa-solid fa-square-plus text-lg"></i> + MESA
        </button>
        <button onclick="addVIP()" class="fab-add bg-blue-700">
            <i class="fa-solid fa-vector-square text-lg"></i> + VIP
        </button>
    </div>

    <!-- ÁREA DE MAPA -->
    <main class="flex-1 overflow-hidden bg-slate-200 relative" id="main-view">
        <div id="map-wrapper">
            <div id="map-container">
                <div id="mesas-layer" class="w-full h-full relative"></div>
            </div>
        </div>
    </main>

    <!-- PANEL INFERIOR (AUDITORÍA) -->
    <footer id="audit-footer" class="p-6 bg-white border-t border-slate-200 z-[140] shadow-2xl safe-bottom">
        <button onclick="openSaveModal()" class="w-full bg-slate-950 text-white py-5 rounded-3xl font-black text-xs uppercase tracking-widest border-b-4 border-slate-800 active:translate-y-1 active:border-b-0 transition-all">Finalizar Auditoría</button>
    </footer>

    <!-- MODAL DE GUARDADO -->
    <div id="modal-save" class="fixed inset-0 bg-slate-900/90 z-[300] hidden items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 space-y-5 shadow-2xl">
            <h3 class="text-xl font-black uppercase italic text-center">Cerrar Reporte</h3>
            <div class="space-y-4">
                <input id="aud-resp" type="text" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold" placeholder="Tu Nombre">
                <input id="aud-lugar" type="text" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold" placeholder="Sector">
                <div class="grid grid-cols-2 gap-2">
                    <input id="aud-insitu" type="number" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm" placeholder="In Situ">
                    <input id="aud-micros" type="number" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm" placeholder="Micros">
                </div>
            </div>
            <button onclick="confirmSave()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg shadow-blue-200">Guardar Ahora</button>
            <button onclick="closeSaveModal()" class="w-full text-slate-400 font-bold uppercase text-[10px] tracking-widest">Cancelar</button>
        </div>
    </div>

    <!-- PANTALLA REPORTES -->
    <div id="history-screen" class="fixed inset-0 bg-white z-[200] hidden flex-col p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8 pt-10">
            <h2 class="text-2xl font-black uppercase italic">Historial</h2>
            <button onclick="setMode('audit')" class="text-slate-300 text-3xl"><i class="fa-solid fa-circle-xmark"></i></button>
        </div>
        <div id="history-list" class="space-y-4 pb-10"></div>
    </div>

    <script>
        const DB_KEY = 'spotcheck_v9_fast';
        let tables = JSON.parse(localStorage.getItem(`${DB_KEY}_tables`)) || [];
        let audits = JSON.parse(localStorage.getItem(`${DB_KEY}_audits`)) || [];
        let currentMode = 'audit';
        let isLocked = true;
        let selectedId = null;
        let zoomLevel = 0.8; // Empezamos con un poco de zoom out para ver más

        function init() {
            if (tables.length === 0) {
                tables = [
                    { id: 1, x: 20, y: 20, label: "01", type: 'mesa', occupied: false },
                    { id: 2, x: 50, y: 20, label: "VIP 1", type: 'vip', w: 160, h: 60, occupied: false }
                ];
            }
            render();
            resetZoom();
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            const container = document.getElementById('map-container');
            layer.innerHTML = '';
            
            container.className = currentMode === 'design' ? 'design-grid' : '';
            container.style.transform = `scale(${zoomLevel})`;

            tables.forEach(t => {
                const el = document.createElement('div');
                const isOccupied = t.occupied;
                
                if (t.type === 'vip') {
                    el.className = `area-vip ${isOccupied ? 'item-occupied' : 'item-free'} ${selectedId === t.id && currentMode === 'design' ? 'selected-design' : ''}`;
                    el.style.width = t.w + 'px';
                    el.style.height = t.h + 'px';
                } else {
                    el.className = `mesa ${isOccupied ? 'item-occupied' : 'item-free'} ${selectedId === t.id && currentMode === 'design' ? 'selected-design' : ''}`;
                }
                
                el.style.left = t.x + '%';
                el.style.top = t.y + '%';
                el.innerText = t.label;

                el.onclick = (e) => {
                    e.stopPropagation();
                    if (currentMode === 'audit') {
                        t.occupied = !t.occupied;
                        save(); render();
                    } else if (currentMode === 'design' && !isLocked) {
                        selectedId = t.id;
                        updateUI();
                        render();
                    }
                };

                if (currentMode === 'design' && !isLocked) {
                    el.onpointerdown = (e) => {
                        selectedId = t.id;
                        updateUI();
                        startDragging(e, t, el);
                    };
                }

                layer.appendChild(el);
            });
        }

        function changeZoom(delta) {
            zoomLevel = Math.max(0.4, Math.min(2.0, zoomLevel + delta));
            render();
        }

        function resetZoom() { zoomLevel = 0.8; render(); }

        function startDragging(e, t, el) {
            const rect = document.getElementById('map-container').getBoundingClientRect();
            
            function onMove(ev) {
                // Cálculo de coordenadas ajustado al Zoom
                let newX = ((ev.clientX - rect.left) / rect.width) * 100;
                let newY = ((ev.clientY - rect.top) / rect.height) * 100;
                t.x = Math.max(2, Math.min(98, newX));
                t.y = Math.max(2, Math.min(98, newY));
                el.style.left = t.x + '%';
                el.style.top = t.y + '%';
            }

            function stop() {
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', stop);
                save();
                render();
            }

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', stop);
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500' : 'fa-solid fa-unlock text-blue-500';
            selectedId = null;
            updateUI();
            render();
        }

        function setMode(m) {
            currentMode = m; selectedId = null;
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('bg-slate-950', 'text-slate-400'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('text-white', 'shadow-lg'));
            document.getElementById(`nav-${m}`).classList.add('bg-slate-950', 'text-white', 'shadow-lg');
            
            document.getElementById('audit-footer').classList.toggle('hidden', m !== 'audit');
            document.getElementById('design-fabs').classList.toggle('hidden', m !== 'design' || isLocked);
            document.getElementById('history-screen').classList.toggle('hidden', m !== 'history');
            
            if(m === 'history') renderHistory();
            updateUI();
            render();
        }

        function updateUI() {
            const topPanel = document.getElementById('design-edit-top');
            const fabs = document.getElementById('design-fabs');
            const item = tables.find(t => t.id === selectedId);

            fabs.classList.toggle('hidden', currentMode !== 'design' || isLocked);

            if (selectedId && currentMode === 'design' && !isLocked) {
                topPanel.classList.remove('hidden');
                document.getElementById('label-input').value = item.label;
                document.getElementById('label-input').oninput = (e) => { item.label = e.target.value; render(); };
                document.getElementById('rotate-btn').classList.toggle('hidden', item.type !== 'vip');
            } else {
                topPanel.classList.add('hidden');
            }
        }

        function addTable() {
            const nextLabel = (tables.filter(x => x.type === 'mesa').length + 1).toString().padStart(2, '0');
            const newTable = { id: Date.now(), x: 50, y: 40, label: nextLabel, type: 'mesa', occupied: false };
            tables.push(newTable);
            selectedId = newTable.id;
            updateUI(); render(); save();
        }

        function addVIP() {
            const newVIP = { id: Date.now(), x: 50, y: 40, label: "VIP", type: 'vip', w: 200, h: 60, occupied: false };
            tables.push(newVIP);
            selectedId = newVIP.id;
            updateUI(); render(); save();
        }

        function rotateSelected() {
            const t = tables.find(x => x.id === selectedId);
            if(t && t.type === 'vip') { [t.w, t.h] = [t.h, t.w]; render(); save(); }
        }

        function deleteSelected() {
            tables = tables.filter(t => t.id !== selectedId);
            selectedId = null; updateUI(); render(); save();
        }

        function openSaveModal() { document.getElementById('modal-save').style.display = 'flex'; }
        function closeSaveModal() { document.getElementById('modal-save').style.display = 'none'; }

        function confirmSave() {
            const audit = {
                id: Date.now(),
                resp: document.getElementById('aud-resp').value || 'S/F',
                lugar: document.getElementById('aud-lugar').value || 'Gral',
                insitu: document.getElementById('aud-insitu').value || '-',
                micros: document.getElementById('aud-micros').value || '-',
                date: new Date().toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}),
                occ: tables.filter(t => t.occupied).length,
                total: tables.length
            };
            audits.unshift(audit);
            tables.forEach(t => t.occupied = false);
            save(); closeSaveModal(); setMode('history');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2 h-full bg-blue-600"></div>
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <p class="text-[8px] font-black uppercase text-slate-400 mb-1">${a.date}</p>
                            <p class="font-black text-slate-900 uppercase leading-none">${a.resp}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black text-blue-600">${Math.round((a.occ/a.total)*100)}%</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[10px] font-bold text-slate-500 uppercase mt-2 pt-2 border-t border-slate-50">
                        <div>Situ: <span class="text-slate-900">${a.insitu}</span></div>
                        <div>Micro: <span class="text-slate-900">${a.micros}</span></div>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 py-10 uppercase text-[10px] font-black">Historial Vacío</p>';
        }

        function save() {
            localStorage.setItem(`${DB_KEY}_tables`, JSON.stringify(tables));
            localStorage.setItem(`${DB_KEY}_audits`, JSON.stringify(audits));
        }

        init();
    </script>
</body>
</html>
