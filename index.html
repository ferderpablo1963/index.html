<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPOT CHECK CONTROL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #10b981;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        .nav-container { 
            display: flex; 
            background: #ffffff; 
            padding: 10px; 
            gap: 8px; 
            border-bottom: 1px solid #e2e8f0;
            z-index: 1000; 
        }
        .nav-btn {
            flex: 1; padding: 12px 4px; border-radius: 16px; color: #94a3b8;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-btn.active { background: #f8fafc; color: var(--primary); border: 1px solid #e2e8f0; }
        .nav-btn.active i { color: var(--accent); }

        .screen { flex: 1; display: none; overflow: hidden; position: relative; }
        .screen.active { display: flex; flex-direction: column; }

        .viewport {
            flex: 1;
            background: #cbd5e1;
            overflow: auto;
            position: relative;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .map-canvas { 
            width: 1500px; 
            height: 1500px; 
            background: white;
            position: relative; 
            border-radius: 1rem; 
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }

        .mesa {
            position: absolute;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 12px;
            touch-action: none; 
            user-select: none;
            z-index: 10;
        }
        
        .mesa-disponible { background: white; border: 2px solid #cbd5e1; color: #64748b; }
        .mesa-ocupada { background: #0f172a; border: 2px solid #0f172a; color: #10b981; }
        .mesa-discrepante { background: #ef4444; border: 2px solid #b91c1c; color: white; }

        .resize-handle {
            position: absolute; right: -5px; bottom: -5px;
            width: 28px; height: 28px; background: #3b82f6;
            border-radius: 50%; border: 2px solid white;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 12px; z-index: 30;
        }

        .btn-delete {
            position: absolute; top: -10px; right: -10px;
            width: 25px; height: 25px; background: #ef4444;
            color: white; border-radius: 50%; border: 2px solid white;
            display: flex; align-items: center; justify-content: center; z-index: 30;
        }

        .edit-input {
            width: 80%;
            background: transparent;
            border: none;
            text-align: center;
            font-weight: 900;
            color: inherit;
            outline: none;
            pointer-events: auto;
        }

        .floating-bar {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 1500;
            width: 90%; max-width: 400px;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <header class="bg-slate-900 p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-emerald-500 rounded flex items-center justify-center">
                <i class="fa-solid fa-check text-slate-900 text-[10px]"></i>
            </div>
            <h1 class="text-white font-black text-xs uppercase tracking-tighter">Spot Check Control</h1>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="bg-slate-800 text-white px-3 py-1 rounded-lg text-[9px] font-bold">
            <i id="lock-icon" class="fa-solid fa-lock text-red-500 mr-1"></i> <span id="lock-text">BLOQUEADO</span>
        </button>
    </header>

    <nav class="nav-container">
        <button onclick="setTab('design')" id="nav-design" class="nav-btn active"><i class="fa-solid fa-pencil"></i>Diseño</button>
        <button onclick="setTab('audit')" id="nav-audit" class="nav-btn"><i class="fa-solid fa-clipboard-check"></i>Auditoría</button>
        <button onclick="setTab('reports')" id="nav-reports" class="nav-btn"><i class="fa-solid fa-chart-line"></i>Historial</button>
    </nav>

    <section id="screen-design" class="screen active">
        <div class="viewport" id="viewport-design">
            <div id="map-canvas" class="map-canvas"></div>
        </div>
        <div id="design-controls" class="hidden floating-bar">
            <div class="flex gap-2">
                <button onclick="confirmReset()" class="bg-red-500 text-white p-4 rounded-2xl shadow-xl"><i class="fa-solid fa-trash"></i></button>
                <button onclick="addTable()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-sm shadow-xl tracking-widest border-b-4 border-blue-800 active:translate-y-1">
                    + Nueva Mesa
                </button>
            </div>
        </div>
    </section>

    <section id="screen-audit" class="screen">
        <div class="viewport">
            <div id="map-canvas-audit" class="map-canvas"></div>
        </div>
        <div class="floating-bar">
            <button onclick="openFinalizeModal()" class="w-full bg-emerald-500 text-slate-900 py-4 rounded-2xl font-black uppercase text-sm shadow-xl border-b-4 border-emerald-700 active:translate-y-1">
                <i class="fa-solid fa-file-export mr-2"></i> Generar Reporte
            </button>
        </div>
    </section>

    <section id="screen-reports" class="screen overflow-y-auto p-4 bg-slate-100">
        <div id="report-list" class="max-w-md mx-auto pb-20 space-y-3"></div>
    </section>

    <!-- Modales -->
    <div id="finalize-modal" class="modal">
        <div class="bg-white w-5/6 max-w-sm rounded-3xl p-6 shadow-2xl">
            <h3 class="font-black text-slate-900 uppercase text-center mb-4">Finalizar Auditoría</h3>
            <input type="text" id="input-sector" placeholder="NOMBRE DEL SECTOR" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold uppercase mb-4 focus:border-emerald-500 outline-none">
            <div class="flex flex-col gap-2">
                <button onclick="saveReport()" class="bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-xs">Guardar Reporte</button>
                <button onclick="closeFinalizeModal()" class="bg-slate-100 text-slate-500 py-3 rounded-xl font-black uppercase text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="reset-modal" class="modal">
        <div class="bg-white w-64 rounded-3xl p-6 text-center shadow-2xl">
            <p class="font-black text-xs uppercase mb-4">¿Borrar todo el mapa?</p>
            <div class="flex gap-2">
                <button onclick="resetCanvas()" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Sí, Borrar</button>
                <button onclick="closeResetModal()" class="flex-1 bg-slate-100 py-3 rounded-xl font-black text-[10px] uppercase">No</button>
            </div>
        </div>
    </div>

    <script>
        let tables = JSON.parse(localStorage.getItem('sp_tables_v3')) || [];
        let reports = JSON.parse(localStorage.getItem('sp_reports_v3')) || [];
        let auditStatus = {}; 
        let isLocked = true;
        let selectedId = null;
        let currentTab = 'design';

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
            if(tab === 'reports') renderReports();
            renderAll();
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500' : 'fa-solid fa-unlock text-emerald-500';
            document.getElementById('lock-text').innerText = isLocked ? 'BLOQUEADO' : 'EDITANDO';
            document.getElementById('design-controls').classList.toggle('hidden', isLocked);
            selectedId = null;
            renderAll();
        }

        function addTable() {
            const viewport = document.getElementById('viewport-design');
            const newTable = {
                id: 't_' + Date.now(),
                x: viewport.scrollLeft + 50, 
                y: viewport.scrollTop + 50, 
                w: 80, h: 80,
                label: (tables.length + 1).toString()
            };
            tables.push(newTable);
            selectedId = newTable.id;
            save();
            renderAll();
        }

        function save() {
            localStorage.setItem('sp_tables_v3', JSON.stringify(tables));
        }

        function renderAll() {
            const container = document.getElementById(currentTab === 'design' ? 'map-canvas' : 'map-canvas-audit');
            if (!container) return;
            container.innerHTML = '';

            tables.forEach(t => {
                const div = document.createElement('div');
                const status = auditStatus[t.id] || 0;
                
                div.className = `mesa ${currentTab === 'audit' ? (status === 1 ? 'mesa-ocupada' : (status === 2 ? 'mesa-discrepante' : 'mesa-disponible')) : 'mesa-disponible'}`;
                
                if(currentTab === 'design' && selectedId === t.id && !isLocked) {
                    div.style.boxShadow = '0 0 0 4px #3b82f6';
                }
                
                div.style.left = t.x + 'px';
                div.style.top = t.y + 'px';
                div.style.width = t.w + 'px';
                div.style.height = t.h + 'px';
                
                // Contenido
                if (currentTab === 'design' && selectedId === t.id && !isLocked) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'edit-input';
                    input.value = t.label;
                    input.onclick = (e) => e.stopPropagation();
                    input.oninput = (e) => { t.label = e.target.value.toUpperCase(); save(); };
                    div.appendChild(input);
                } else {
                    div.innerText = t.label;
                }

                if (currentTab === 'audit') {
                    div.onclick = () => {
                        auditStatus[t.id] = (status + 1) % 3;
                        renderAll();
                    };
                } else if (!isLocked) {
                    // Lógica de Movimiento
                    div.onpointerdown = (e) => {
                        if (e.target.closest('.resize-handle') || e.target.closest('.btn-delete')) return;
                        
                        // Si se hace clic en el input, permitimos foco pero también arrastre desde el contenedor
                        if (e.target.tagName !== 'INPUT') {
                            e.preventDefault();
                        }

                        selectedId = t.id;
                        renderAll();
                        
                        const startX = e.clientX;
                        const startY = e.clientY;
                        const initialX = t.x;
                        const initialY = t.y;

                        const onMove = (em) => {
                            t.x = initialX + (em.clientX - startX);
                            t.y = initialY + (em.clientY - startY);
                            div.style.left = t.x + 'px';
                            div.style.top = t.y + 'px';
                        };

                        const onUp = () => {
                            document.removeEventListener('pointermove', onMove);
                            document.removeEventListener('pointerup', onUp);
                            save();
                        };

                        document.addEventListener('pointermove', onMove);
                        document.addEventListener('pointerup', onUp);
                    };

                    // Accesorios si está seleccionada
                    if (selectedId === t.id) {
                        const del = document.createElement('div');
                        del.className = 'btn-delete';
                        del.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        del.onpointerdown = (e) => {
                            e.stopPropagation();
                            tables = tables.filter(x => x.id !== t.id);
                            selectedId = null;
                            save(); renderAll();
                        };
                        div.appendChild(del);

                        const resizer = document.createElement('div');
                        resizer.className = 'resize-handle';
                        resizer.innerHTML = '<i class="fa-solid fa-expand"></i>';
                        resizer.onpointerdown = (e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            const startW = t.w;
                            const startH = t.h;
                            const startX = e.clientX;
                            const startY = e.clientY;

                            const onResizeMove = (em) => {
                                t.w = Math.max(40, startW + (em.clientX - startX));
                                t.h = Math.max(40, startH + (em.clientY - startY));
                                div.style.width = t.w + 'px';
                                div.style.height = t.h + 'px';
                            };

                            const onResizeUp = () => {
                                document.removeEventListener('pointermove', onResizeMove);
                                document.removeEventListener('pointerup', onResizeUp);
                                save();
                            };

                            document.addEventListener('pointermove', onResizeMove);
                            document.addEventListener('pointerup', onResizeUp);
                        };
                        div.appendChild(resizer);
                    }
                }
                container.appendChild(div);
            });
        }

        function openFinalizeModal() { document.getElementById('finalize-modal').classList.add('active'); }
        function closeFinalizeModal() { document.getElementById('finalize-modal').classList.remove('active'); }

        function saveReport() {
            const sector = document.getElementById('input-sector').value || "Sector Sin Nombre";
            const ocupadas = Object.values(auditStatus).filter(s => s === 1).length;
            const discrepantes = Object.values(auditStatus).filter(s => s === 2).length;
            
            const r = {
                id: Date.now(),
                sector: sector.toUpperCase(),
                total: tables.length,
                ocupadas, discrepantes,
                fecha: new Date().toLocaleDateString(),
                hora: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            };
            reports.unshift(r);
            localStorage.setItem('sp_reports_v3', JSON.stringify(reports));
            closeFinalizeModal();
            setTab('reports');
        }

        function renderReports() {
            const list = document.getElementById('report-list');
            list.innerHTML = reports.map(r => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-black text-slate-900 text-xs uppercase">${r.sector}</h3>
                        <span class="text-[9px] font-bold text-slate-400">${r.fecha}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <p class="text-[8px] font-bold text-slate-400 uppercase">Total</p>
                            <p class="font-black text-slate-800">${r.total}</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <p class="text-[8px] font-bold text-slate-400 uppercase">Ocup.</p>
                            <p class="font-black text-emerald-600">${r.ocupadas}</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <p class="text-[8px] font-bold text-slate-400 uppercase">Disc.</p>
                            <p class="font-black text-red-500">${r.discrepantes}</p>
                        </div>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-400 text-[10px] py-10 font-black uppercase">No hay reportes guardados</p>';
        }

        function confirmReset() { document.getElementById('reset-modal').classList.add('active'); }
        function closeResetModal() { document.getElementById('reset-modal').classList.remove('active'); }
        function resetCanvas() { tables = []; save(); renderAll(); closeResetModal(); }

        window.onload = renderAll;
    </script>
</body>
</html>
