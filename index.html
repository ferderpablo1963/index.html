<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPOT CHECK CONTROL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #10b981;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            touch-action: none;
        }

        .nav-container { 
            display: flex; 
            background: #ffffff; 
            padding: 10px; 
            gap: 8px; 
            border-bottom: 1px solid #e2e8f0;
            z-index: 1000; 
        }
        .nav-btn {
            flex: 1; padding: 12px 4px; border-radius: 16px; color: #94a3b8;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-btn.active { background: #f8fafc; color: var(--primary); border: 1px solid #e2e8f0; }
        .nav-btn.active i { color: var(--accent); }

        .screen { flex: 1; display: none; overflow: hidden; position: relative; }
        .screen.active { display: flex; flex-direction: column; }

        .viewport {
            flex: 1;
            background: #cbd5e1;
            overflow: auto;
            position: relative;
            padding: 20px;
        }

        .map-canvas { 
            width: 1500px; 
            height: 1500px; 
            background: white;
            position: relative; 
            border-radius: 1rem; 
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .mesa {
            position: absolute;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px; 
            border-radius: 12px;
            touch-action: none; 
            user-select: none;
            z-index: 10;
            cursor: move;
            transition: box-shadow 0.2s;
        }
        
        .mesa-disponible { background: white; border: 2px solid #cbd5e1; color: #64748b; }
        .mesa-ocupada { background: #0f172a; border: 2px solid #0f172a; color: #10b981; }
        .mesa-discrepante { background: #ef4444; border: 2px solid #b91c1c; color: white; }

        .resize-handle {
            position: absolute; right: -5px; bottom: -5px;
            width: 32px; height: 32px; background: #3b82f6;
            border-radius: 50%; border: 3px solid white;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; z-index: 40;
            cursor: nwse-resize;
        }

        .btn-delete {
            position: absolute; top: -12px; right: -12px;
            width: 28px; height: 28px; background: #ef4444;
            color: white; border-radius: 50%; border: 3px solid white;
            display: flex; align-items: center; justify-content: center; z-index: 40;
        }

        .edit-input {
            width: 90%; background: transparent; border: none;
            text-align: center; font-weight: 900; color: inherit;
            outline: none; pointer-events: auto;
        }

        .floating-bar {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 1500;
            width: 90%; max-width: 400px;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <header class="bg-slate-900 p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-emerald-500 rounded flex items-center justify-center">
                <i class="fa-solid fa-check text-slate-900 text-[10px]"></i>
            </div>
            <h1 class="text-white font-black text-xs uppercase tracking-tighter">Spot Check Control</h1>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="bg-slate-800 text-white px-3 py-1 rounded-lg text-[9px] font-bold transition-all active:scale-95">
            <i id="lock-icon" class="fa-solid fa-lock text-red-500 mr-1"></i> <span id="lock-text">BLOQUEADO</span>
        </button>
    </header>

    <nav class="nav-container shrink-0">
        <button onclick="setTab('design')" id="nav-design" class="nav-btn active"><i class="fa-solid fa-pencil"></i>Diseño</button>
        <button onclick="setTab('audit')" id="nav-audit" class="nav-btn"><i class="fa-solid fa-clipboard-check"></i>Auditoría</button>
        <button onclick="setTab('reports')" id="nav-reports" class="nav-btn"><i class="fa-solid fa-chart-line"></i>Historial</button>
    </nav>

    <section id="screen-design" class="screen active">
        <div class="viewport" id="viewport-design">
            <div id="map-canvas" class="map-canvas"></div>
        </div>
        <div id="design-controls" class="hidden floating-bar">
            <div class="flex gap-2">
                <button onclick="confirmReset()" class="bg-red-500 text-white p-4 rounded-2xl shadow-xl"><i class="fa-solid fa-trash"></i></button>
                <button onclick="addTable()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-sm shadow-xl border-b-4 border-blue-800 active:translate-y-1">
                    + Nueva Mesa
                </button>
            </div>
        </div>
    </section>

    <section id="screen-audit" class="screen">
        <div class="viewport" id="viewport-audit">
            <div id="map-canvas-audit" class="map-canvas"></div>
        </div>
        <div class="floating-bar">
            <button onclick="openFinalizeModal()" class="w-full bg-emerald-500 text-slate-900 py-4 rounded-2xl font-black uppercase text-sm shadow-xl border-b-4 border-emerald-700 active:translate-y-1">
                <i class="fa-solid fa-file-export mr-2"></i> Generar Reporte
            </button>
        </div>
    </section>

    <section id="screen-reports" class="screen overflow-y-auto p-4 bg-slate-100">
        <div id="report-list" class="max-w-md mx-auto pb-24 space-y-3"></div>
    </section>

    <!-- Modal Finalizar -->
    <div id="finalize-modal" class="modal">
        <div class="bg-white w-5/6 max-w-sm rounded-3xl p-6 shadow-2xl">
            <h3 class="font-black text-slate-900 uppercase text-center mb-4">Finalizar Auditoría</h3>
            <input type="text" id="input-sector" placeholder="NOMBRE DEL SECTOR" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold uppercase mb-4 outline-none focus:border-emerald-500">
            <div class="flex flex-col gap-2">
                <button onclick="saveReport()" class="bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-xs">Guardar Reporte</button>
                <button onclick="closeFinalizeModal()" class="bg-slate-100 text-slate-500 py-3 rounded-xl font-black uppercase text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Reset -->
    <div id="reset-modal" class="modal">
        <div class="bg-white w-64 rounded-3xl p-6 text-center shadow-2xl">
            <p class="font-black text-xs uppercase mb-4">¿Borrar todo el mapa?</p>
            <div class="flex gap-2">
                <button onclick="resetCanvas()" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Sí, Borrar</button>
                <button onclick="closeResetModal()" class="flex-1 bg-slate-100 py-3 rounded-xl font-black text-[10px] uppercase">No</button>
            </div>
        </div>
    </div>

    <!-- Modal Detalle Reporte -->
    <div id="detail-modal" class="modal">
        <div class="bg-white w-[95%] max-w-lg h-[85vh] rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 id="detail-title" class="font-black uppercase text-xs">Detalle</h3>
                <button onclick="closeDetailModal()" class="text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-auto bg-slate-200 p-4">
                <div id="detail-map-container" class="map-canvas scale-[0.6] origin-top-left"></div>
            </div>
            <div class="p-4 bg-white border-t flex justify-between gap-2">
                 <button onclick="deleteReport()" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase">Borrar</button>
                 <button onclick="closeDetailModal()" class="flex-1 bg-slate-900 text-white py-2 rounded-xl text-[10px] font-black uppercase">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let tables = JSON.parse(localStorage.getItem('sp_tables_v3')) || [];
        let reports = JSON.parse(localStorage.getItem('sp_reports_v3')) || [];
        let auditStatus = {}; 
        let isLocked = true;
        let selectedId = null;
        let currentTab = 'design';
        let viewingReportId = null;

        function save() { localStorage.setItem('sp_tables_v3', JSON.stringify(tables)); }

        function toggleLock() {
            isLocked = !isLocked;
            const icon = document.getElementById('lock-icon');
            const text = document.getElementById('lock-text');
            icon.className = isLocked ? 'fa-solid fa-lock text-red-500' : 'fa-solid fa-unlock text-emerald-500';
            text.innerText = isLocked ? 'BLOQUEADO' : 'EDITANDO';
            document.getElementById('design-controls').classList.toggle('hidden', isLocked);
            selectedId = null;
            renderAll();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
            if(tab === 'reports') renderReports();
            renderAll();
        }

        function addTable() {
            const view = document.getElementById('viewport-design');
            const newT = {
                id: 't_' + Date.now(),
                x: view.scrollLeft + 60, y: view.scrollTop + 60,
                w: 80, h: 80, label: (tables.length + 1).toString()
            };
            tables.push(newT);
            selectedId = newT.id;
            save(); renderAll();
        }

        function renderAll() {
            const container = document.getElementById(currentTab === 'design' ? 'map-canvas' : 'map-canvas-audit');
            if (!container) return;
            container.innerHTML = '';
            
            tables.forEach(t => {
                const status = auditStatus[t.id] || 0;
                const div = createTableElement(t, currentTab, status);
                
                if (currentTab === 'audit') {
                    div.onclick = () => {
                        auditStatus[t.id] = (status + 1) % 3;
                        renderAll();
                    };
                } else if (currentTab === 'design' && !isLocked) {
                    div.onpointerdown = (e) => {
                        if (e.target.closest('.resize-handle') || e.target.closest('.btn-delete')) return;
                        
                        e.preventDefault();
                        div.setPointerCapture(e.pointerId);
                        selectedId = t.id;
                        renderAll();

                        const startX = e.clientX;
                        const startY = e.clientY;
                        const initialX = t.x;
                        const initialY = t.y;

                        const moveHandler = (em) => {
                            t.x = initialX + (em.clientX - startX);
                            t.y = initialY + (em.clientY - startY);
                            div.style.left = t.x + 'px';
                            div.style.top = t.y + 'px';
                        };

                        const upHandler = () => {
                            div.removeEventListener('pointermove', moveHandler);
                            div.removeEventListener('pointerup', upHandler);
                            save();
                        };

                        div.addEventListener('pointermove', moveHandler);
                        div.addEventListener('pointerup', upHandler);
                    };

                    if (selectedId === t.id) {
                        const del = document.createElement('div');
                        del.className = 'btn-delete';
                        del.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                        del.onpointerdown = (e) => {
                            e.stopPropagation();
                            tables = tables.filter(x => x.id !== t.id);
                            selectedId = null;
                            save(); renderAll();
                        };
                        div.appendChild(del);

                        const res = document.createElement('div');
                        res.className = 'resize-handle';
                        res.innerHTML = '<i class="fa-solid fa-up-right-and-down-left-from-center"></i>';
                        res.onpointerdown = (e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            res.setPointerCapture(e.pointerId);
                            const sW = t.w, sH = t.h, sX = e.clientX, sY = e.clientY;

                            const resMove = (em) => {
                                t.w = Math.max(50, sW + (em.clientX - sX));
                                t.h = Math.max(50, sH + (em.clientY - sY));
                                div.style.width = t.w + 'px';
                                div.style.height = t.h + 'px';
                            };
                            const resUp = () => {
                                res.removeEventListener('pointermove', resMove);
                                res.removeEventListener('pointerup', resUp);
                                save();
                            };
                            res.addEventListener('pointermove', resMove);
                            res.addEventListener('pointerup', resUp);
                        };
                        div.appendChild(res);
                    }
                }
                container.appendChild(div);
            });
        }

        function createTableElement(t, mode, status) {
            const div = document.createElement('div');
            let colorClass = 'mesa-disponible';
            if (mode === 'audit' || mode === 'detail') {
                if (status === 1) colorClass = 'mesa-ocupada';
                if (status === 2) colorClass = 'mesa-discrepante';
            }
            
            div.className = `mesa ${colorClass}`;
            if (mode === 'design' && selectedId === t.id && !isLocked) div.style.boxShadow = '0 0 0 4px #3b82f6, 0 10px 20px rgba(0,0,0,0.2)';
            
            div.style.left = t.x + 'px';
            div.style.top = t.y + 'px';
            div.style.width = t.w + 'px';
            div.style.height = t.h + 'px';

            if (mode === 'design' && selectedId === t.id && !isLocked) {
                const inp = document.createElement('input');
                inp.className = 'edit-input';
                inp.value = t.label;
                inp.onpointerdown = (e) => e.stopPropagation();
                inp.oninput = (e) => { t.label = e.target.value.toUpperCase(); save(); };
                div.appendChild(inp);
            } else {
                div.innerText = t.label;
            }
            return div;
        }

        function openFinalizeModal() { document.getElementById('finalize-modal').classList.add('active'); }
        function closeFinalizeModal() { document.getElementById('finalize-modal').classList.remove('active'); }

        function saveReport() {
            const sec = document.getElementById('input-sector').value || "SECTOR GENERAL";
            const report = {
                id: Date.now(),
                sector: sec.toUpperCase(),
                total: tables.length,
                ocupadas: Object.values(auditStatus).filter(v => v === 1).length,
                discrepantes: Object.values(auditStatus).filter(v => v === 2).length,
                fecha: new Date().toLocaleDateString(),
                hora: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                snapshot: JSON.parse(JSON.stringify(tables)),
                statusMap: JSON.parse(JSON.stringify(auditStatus))
            };
            reports.unshift(report);
            localStorage.setItem('sp_reports_v3', JSON.stringify(reports));
            auditStatus = {};
            closeFinalizeModal();
            setTab('reports');
        }

        function renderReports() {
            const list = document.getElementById('report-list');
            list.innerHTML = reports.map(r => `
                <div onclick="openReportDetail(${r.id})" class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-emerald-500 active:bg-slate-50 transition-colors">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-black text-slate-900 text-xs uppercase">${r.sector}</h3>
                        <span class="text-[9px] font-bold text-slate-400">${r.fecha} ${r.hora}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <span class="block text-[7px] font-black text-slate-400 uppercase">Total</span>
                            <span class="font-black text-slate-800">${r.total}</span>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <span class="block text-[7px] font-black text-slate-400 uppercase">Ocup.</span>
                            <span class="font-black text-emerald-600">${r.ocupadas}</span>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <span class="block text-[7px] font-black text-slate-400 uppercase">Disc.</span>
                            <span class="font-black text-red-500">${r.discrepantes}</span>
                        </div>
                    </div>
                </div>
            `).join('') || '<div class="text-center py-20 text-slate-400 font-bold uppercase text-xs">Sin Historial</div>';
        }

        function openReportDetail(id) {
            const r = reports.find(x => x.id === id);
            if (!r) return;
            viewingReportId = id;
            document.getElementById('detail-title').innerText = `${r.sector} - ${r.fecha}`;
            const container = document.getElementById('detail-map-container');
            container.innerHTML = '';
            r.snapshot.forEach(t => {
                const status = r.statusMap[t.id] || 0;
                container.appendChild(createTableElement(t, 'detail', status));
            });
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeDetailModal() { document.getElementById('detail-modal').classList.remove('active'); }
        function deleteReport() {
            reports = reports.filter(r => r.id !== viewingReportId);
            localStorage.setItem('sp_reports_v3', JSON.stringify(reports));
            closeDetailModal(); renderReports();
        }

        function confirmReset() { document.getElementById('reset-modal').classList.add('active'); }
        function closeResetModal() { document.getElementById('reset-modal').classList.remove('active'); }
        function resetCanvas() { tables = []; save(); renderAll(); closeResetModal(); }

        window.onload = renderAll;
    </script>
</body>
</html>
