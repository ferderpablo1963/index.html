<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - CONTROL PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc;
        }
        
        #viewport {
            overflow: hidden;
            touch-action: none;
            position: relative;
            background-color: #e2e8f0;
            flex: 1;
        }

        #map-container { 
            height: 1200px; 
            width: 1500px;
            position: absolute;
            background-color: #ffffff;
            transform-origin: 0 0;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .design-grid {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .mesa {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            border: 2px solid #cbd5e1;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        .mesa.dragging {
            opacity: 0.7;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            border-color: #f59e0b !important;
        }

        .mesa.circulo { border-radius: 50%; }
        .mesa.cuadrado { border-radius: 8px; }

        .status-free { background-color: #ffffff; color: #1e293b; border-color: #e2e8f0; }
        .status-occupied { background-color: #000000; color: #ffffff; border-color: #000000; }
        .status-undefined { background-color: #ef4444; color: #ffffff; border-color: #b91c1c; }

        .screen-overlay {
            position: fixed;
            inset: 0;
            top: 130px; 
            background-color: #f8fafc;
            z-index: 200;   
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .screen-overlay.active { display: flex; }

        .tab-btn {
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            border-bottom-color: #ef4444;
            color: #ef4444;
        }

        .zoom-ctrl {
            position: fixed;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .btn-round {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: #1e293b;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- HEADER & TABS SUPERIORES -->
    <header class="bg-slate-950 text-white p-4 pt-6 shrink-0">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center italic font-black text-xs">SC</div>
                <h1 class="font-black text-lg tracking-tighter uppercase italic leading-none">SPOT CHECK</h1>
            </div>
            <button onclick="openModal('save-modal')" class="bg-red-600 px-4 py-2 rounded-full text-[10px] font-black uppercase italic">Finalizar</button>
        </div>
        
        <div class="flex gap-6 overflow-x-auto no-scrollbar border-t border-white/10 pt-2">
            <button onclick="switchTab('map')" id="btn-map" class="tab-btn active px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap">MAPA</button>
            <button onclick="switchTab('notes')" id="btn-notes" class="tab-btn text-slate-500 px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap">NOTAS</button>
            <button onclick="switchTab('report')" id="btn-report" class="tab-btn text-slate-500 px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap">REPORTES</button>
            <button onclick="switchTab('design')" id="btn-design" class="tab-btn text-slate-500 px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap text-amber-500">DISEÑO</button>
        </div>
    </header>

    <!-- ESTADÍSTICAS RÁPIDAS -->
    <div class="bg-white border-b border-slate-200 px-4 py-2 flex justify-between items-center z-10 shrink-0">
        <div class="flex gap-4">
            <div class="flex items-center gap-1"><div class="w-2 h-2 bg-slate-200 rounded-full"></div><span id="c-free" class="text-[10px] font-black italic">0</span></div>
            <div class="flex items-center gap-1"><div class="w-2 h-2 bg-black rounded-full"></div><span id="c-occ" class="text-[10px] font-black italic">0</span></div>
            <div class="flex items-center gap-1"><div class="w-2 h-2 bg-red-500 rounded-full"></div><span id="c-und" class="text-[10px] font-black italic text-red-600">0</span></div>
        </div>
        <div id="mode-indicator" class="text-[8px] font-black uppercase text-slate-400 bg-slate-100 px-2 py-1 rounded">VISTA LECTURA</div>
    </div>

    <!-- ÁREA DE MAPA -->
    <main id="viewport">
        <div id="map-container">
            <!-- Referencias fijas del plano -->
            <div class="absolute bg-slate-50 border-2 border-dashed border-slate-200 flex items-center justify-center font-black text-slate-200 italic text-2xl" style="left: 450px; top: 20px; width: 450px; height: 80px; border-radius: 40px;">BARRA PRINCIPAL</div>
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
        
        <div class="zoom-ctrl">
            <button onclick="changeZoom(0.1)" class="btn-round"><i class="fa-solid fa-plus"></i></button>
            <button onclick="changeZoom(-0.1)" class="btn-round"><i class="fa-solid fa-minus"></i></button>
            <button onclick="resetZoom()" class="btn-round"><i class="fa-solid fa-compress"></i></button>
        </div>
    </main>

    <!-- PANTALLAS OVERLAY -->
    <div id="notes-screen" class="screen-overlay">
        <h2 class="font-black text-xl italic uppercase mb-4 text-slate-800">Notas de Turno</h2>
        <textarea id="main-notes" placeholder="Escribe observaciones aquí..." class="w-full h-80 p-5 bg-white rounded-3xl border-2 border-slate-100 font-bold text-slate-600 uppercase text-xs shadow-inner"></textarea>
    </div>

    <div id="report-screen" class="screen-overlay">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-xl italic uppercase text-slate-800">Historial</h2>
            <button onclick="clearHistory()" class="text-red-500 text-[10px] font-black uppercase italic">Limpiar Todo</button>
        </div>
        <div id="history-list" class="space-y-4 pb-10"></div>
    </div>

    <div id="design-screen" class="screen-overlay">
        <div class="space-y-6">
            <div class="bg-amber-50 border-2 border-amber-200 p-5 rounded-3xl">
                <h3 class="font-black text-amber-800 uppercase italic text-sm mb-2">Editor de Plano</h3>
                <p class="text-[10px] text-amber-700 font-bold leading-tight">En esta pestaña puedes arrastrar las mesas libremente para ajustar el plano. Se guardará la posición al soltar.</p>
            </div>
            <button onclick="resetLayout()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black uppercase italic text-xs">Restablecer Posiciones</button>
            <button onclick="switchTab('map')" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-black uppercase italic text-xs text-center">Ver en el Mapa</button>
        </div>
    </div>

    <!-- MODAL FINALIZAR -->
    <div id="save-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-[500] items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-center font-black uppercase italic text-lg mb-6 tracking-tighter">Guardar Auditoría</h3>
            <div class="space-y-4 mb-8">
                <input id="f-auditor" type="text" placeholder="NOMBRE AUDITOR" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-black uppercase text-xs">
                <div class="grid grid-cols-2 gap-3">
                    <input id="f-fisico" type="number" placeholder="CONTEO FÍSICO" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-black text-xs">
                    <input id="f-sistema" type="number" placeholder="CONTEO SISTEMA" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-black text-xs">
                </div>
            </div>
            <button onclick="confirmSave()" class="w-full py-5 bg-red-600 text-white rounded-2xl font-black uppercase italic shadow-xl shadow-red-900/40 mb-4">Confirmar y Guardar</button>
            <button onclick="closeModal('save-modal')" class="w-full text-slate-400 font-black text-[10px] uppercase italic tracking-widest">Cerrar</button>
        </div>
    </div>

    <script>
        const DB_PREFIX = 'SC_PROF_V4_TOP';
        let tables = [];
        let audits = JSON.parse(localStorage.getItem(`${DB_PREFIX}_audits`)) || [];
        let isDesignMode = false;
        let scale = 0.6, tx = 20, ty = 20;

        function createInitialLayout() {
            const layout = [];
            // Fila Superior Barra (1-10)
            for(let i=0; i<10; i++) layout.push({ id: i+1, label: `${i+1}`, x: 450 + (i*55), y: 140, w: 45, h: 45, type: 'cuadrado', status: 'free' });
            // Fila VIP (11-20)
            for(let i=0; i<10; i++) layout.push({ id: 11+i, label: `${11+i}`, x: 50 + (i*95), y: 350, w: 75, h: 75, type: 'cuadrado', status: 'free' });
            // Fila Redondas (21-30)
            for(let i=0; i<10; i++) layout.push({ id: 21+i, label: `${21+i}`, x: 100 + (i*140), y: 550, w: 90, h: 90, type: 'circulo', status: 'free' });
            // Fila Acceso (31-40)
            for(let i=0; i<10; i++) layout.push({ id: 31+i, label: `${31+i}`, x: 50 + (i*95), y: 800, w: 75, h: 75, type: 'cuadrado', status: 'free' });
            tables = layout;
            saveTables();
        }

        const view = document.getElementById('viewport');
        const map = document.getElementById('map-container');

        function init() {
            const saved = localStorage.getItem(`${DB_PREFIX}_tables`);
            if(saved) tables = JSON.parse(saved); else createInitialLayout();
            render();
            setupPanning();
            resetZoom();
        }

        function setupPanning() {
            let isPanning = false, startP = { x: 0, y: 0 };
            view.onpointerdown = e => { 
                if(e.target.closest('.mesa')) return;
                isPanning = true; 
                startP = { x: e.clientX - tx, y: e.clientY - ty }; 
                view.setPointerCapture(e.pointerId);
            };
            view.onpointermove = e => { if(isPanning) { tx = e.clientX - startP.x; ty = e.clientY - startP.y; applyTransform(); } };
            view.onpointerup = e => { isPanning = false; view.releasePointerCapture(e.pointerId); };
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            layer.innerHTML = '';
            let f=0, o=0, u=0;
            
            tables.forEach(t => {
                if(t.status === 'free') f++; else if(t.status === 'occupied') o++; else u++;
                
                const div = document.createElement('div');
                div.className = `mesa ${t.type} status-${t.status}`;
                div.style.left = t.x + 'px';
                div.style.top = t.y + 'px';
                div.style.width = t.w + 'px';
                div.style.height = t.h + 'px';
                div.innerText = t.label;

                // Evento Principal
                div.onpointerdown = (e) => {
                    if(!isDesignMode) {
                        t.status = t.status === 'free' ? 'occupied' : (t.status === 'occupied' ? 'undefined' : 'free');
                        saveTables(); render();
                    } else {
                        handleMesaDrag(e, t, div);
                    }
                    e.stopPropagation();
                };
                layer.appendChild(div);
            });
            document.getElementById('c-free').innerText = f;
            document.getElementById('c-occ').innerText = o;
            document.getElementById('c-und').innerText = u;
        }

        function handleMesaDrag(e, tableObj, element) {
            let startX = e.clientX;
            let startY = e.clientY;
            let initialX = tableObj.x;
            let initialY = tableObj.y;
            
            element.classList.add('dragging');
            element.setPointerCapture(e.pointerId);
            
            const onMove = (moveEv) => {
                const dx = (moveEv.clientX - startX) / scale;
                const dy = (moveEv.clientY - startY) / scale;
                
                // Movimiento libre con ligera rejilla de 5px
                tableObj.x = Math.round((initialX + dx) / 5) * 5;
                tableObj.y = Math.round((initialY + dy) / 5) * 5;
                
                element.style.left = tableObj.x + 'px';
                element.style.top = tableObj.y + 'px';
            };

            const onUp = () => {
                element.classList.remove('dragging');
                saveTables();
                element.removeEventListener('pointermove', onMove);
                element.removeEventListener('pointerup', onUp);
            };

            element.addEventListener('pointermove', onMove);
            element.addEventListener('pointerup', onUp);
        }

        function switchTab(tab) {
            const screens = ['notes-screen', 'report-screen', 'design-screen'];
            screens.forEach(s => document.getElementById(s).classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            isDesignMode = (tab === 'design');
            const indicator = document.getElementById('mode-indicator');
            
            if(isDesignMode) {
                map.classList.add('design-grid');
                indicator.innerText = "MODO EDICIÓN (ARRASTRE)";
                indicator.className = "text-[8px] font-black uppercase text-amber-600 bg-amber-100 px-2 py-1 rounded";
            } else {
                map.classList.remove('design-grid');
                indicator.innerText = "VISTA LECTURA";
                indicator.className = "text-[8px] font-black uppercase text-slate-400 bg-slate-100 px-2 py-1 rounded";
            }

            if(tab !== 'map') document.getElementById(`${tab}-screen`).classList.add('active');
            if(tab === 'report') renderHistory();
            document.getElementById(`btn-${tab}`).classList.add('active');
        }

        function confirmSave() {
            const a = {
                id: Date.now(),
                fecha: new Date().toLocaleString(),
                auditor: document.getElementById('f-auditor').value || 'S/D',
                insitu: document.getElementById('f-fisico').value || '0',
                micros: document.getElementById('f-sistema').value || '0',
                obs: document.getElementById('main-notes').value || '-',
                stats: { o: tables.filter(t => t.status === 'occupied').length, i: tables.filter(t => t.status === 'undefined').length }
            };
            audits.unshift(a);
            localStorage.setItem(`${DB_PREFIX}_audits`, JSON.stringify(audits));
            closeModal('save-modal');
            switchTab('report');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-5 rounded-3xl border border-slate-100">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-[7px] font-black text-slate-300 block uppercase">${a.fecha}</span>
                            <span class="font-black text-slate-800 text-xs uppercase">${a.auditor}</span>
                        </div>
                        <div class="text-right">
                            <div class="text-[9px] font-black text-slate-400">MESAS: ${a.stats.o}</div>
                            <div class="text-[9px] font-black text-red-500">FALLO: ${a.stats.i}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-2xl mb-2">
                        <div class="text-center">
                            <span class="text-[7px] font-bold text-slate-400 uppercase block">In Situ</span>
                            <span class="font-black text-slate-700">${a.insitu}</span>
                        </div>
                        <div class="text-center">
                            <span class="text-[7px] font-bold text-slate-400 uppercase block">Micros</span>
                            <span class="font-black text-red-600">${a.micros}</span>
                        </div>
                    </div>
                    <p class="text-[9px] text-slate-500 italic uppercase leading-none mt-2">${a.obs}</p>
                </div>
            `).join('') || '<p class="text-center py-20 uppercase font-black text-slate-300">Sin reportes</p>';
        }

        function changeZoom(d) { scale = Math.min(Math.max(scale + d, 0.2), 2); applyTransform(); }
        function resetZoom() { scale = 0.6; tx = 20; ty = 20; applyTransform(); }
        function applyTransform() { map.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
        function saveTables() { localStorage.setItem(`${DB_PREFIX}_tables`, JSON.stringify(tables)); }
        function resetLayout() { if(confirm("¿Restablecer el diseño original?")) { createInitialLayout(); render(); } }
        function clearHistory() { if(confirm("¿Limpiar historial?")) { audits=[]; localStorage.removeItem(`${DB_PREFIX}_audits`); renderHistory(); } }
        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        window.onload = init;
    </script>
</body>
</html>
