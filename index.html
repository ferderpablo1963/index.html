<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - CONTROL PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc;
        }
        
        #viewport {
            overflow: hidden;
            touch-action: none;
            position: relative;
            background-color: #e2e8f0;
            flex: 1;
        }

        #map-container { 
            height: 1500px; 
            width: 2000px;
            position: absolute;
            background-color: #ffffff;
            transform-origin: 0 0;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .design-grid {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .mesa {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            border: 2px solid #cbd5e1;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            z-index: 10;
        }

        .mesa.dragging {
            opacity: 0.8;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            border-color: #f59e0b !important;
            transform: scale(1.1);
        }

        .mesa.circulo { border-radius: 50%; }
        .mesa.cuadrado { border-radius: 12px; }

        .status-free { background-color: #ffffff; color: #1e293b; border-color: #e2e8f0; }
        .status-occupied { background-color: #000000; color: #ffffff; border-color: #000000; }
        .status-undefined { background-color: #ef4444; color: #ffffff; border-color: #b91c1c; }

        .screen-overlay {
            position: fixed;
            inset: 0;
            top: 130px; 
            background-color: #f8fafc;
            z-index: 200;   
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .screen-overlay.active { display: flex; }

        .tab-btn {
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            opacity: 0.5;
        }
        .tab-btn.active {
            border-bottom-color: #ef4444;
            color: #ef4444;
            opacity: 1;
        }

        .zoom-ctrl {
            position: fixed;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .btn-round {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            color: #1e293b;
            border: 1px solid #f1f5f9;
        }

        #design-toolbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            padding: 12px 24px;
            border-radius: 24px;
            display: none;
            gap: 15px;
            align-items: center;
            z-index: 300;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-slate-950 text-white p-4 pt-6 shrink-0 z-[400]">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center italic font-black text-xs">SC</div>
                <h1 class="font-black text-lg tracking-tighter uppercase italic leading-none">SPOT CHECK</h1>
            </div>
            <button onclick="openModal('save-modal')" class="bg-red-600 px-5 py-2 rounded-full text-[10px] font-black uppercase italic tracking-widest">Finalizar</button>
        </div>
        
        <div class="flex gap-6 overflow-x-auto no-scrollbar border-t border-white/10 pt-2">
            <button onclick="switchTab('map')" id="btn-map" class="tab-btn active px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap">MAPA</button>
            <button onclick="switchTab('notes')" id="btn-notes" class="tab-btn text-slate-500 px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap">NOTAS</button>
            <button onclick="switchTab('report')" id="btn-report" class="tab-btn text-slate-500 px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap">REPORTES</button>
            <button onclick="switchTab('design')" id="btn-design" class="tab-btn text-amber-500 px-1 py-2 font-black text-[10px] uppercase italic whitespace-nowrap">CONSTRUCTOR</button>
        </div>
    </header>

    <!-- ESTADÍSTICAS -->
    <div class="bg-white border-b border-slate-200 px-4 py-2 flex justify-between items-center z-10 shrink-0">
        <div class="flex gap-4">
            <div class="flex items-center gap-1"><div class="w-2 h-2 bg-slate-200 rounded-full border border-slate-300"></div><span id="c-free" class="text-[10px] font-black italic">0</span></div>
            <div class="flex items-center gap-1"><div class="w-2 h-2 bg-black rounded-full"></div><span id="c-occ" class="text-[10px] font-black italic">0</span></div>
            <div class="flex items-center gap-1"><div class="w-2 h-2 bg-red-500 rounded-full"></div><span id="c-und" class="text-[10px] font-black italic text-red-600">0</span></div>
        </div>
        <div id="mode-indicator" class="text-[8px] font-black uppercase text-slate-400 bg-slate-100 px-2 py-1 rounded tracking-widest transition-all">MODO LECTURA</div>
    </div>

    <!-- ÁREA DEL MAPA -->
    <main id="viewport">
        <div id="map-container">
            <!-- Referencia estática de barra -->
            <div class="absolute bg-slate-100 border-2 border-dashed border-slate-300 flex items-center justify-center font-black text-slate-300 italic text-2xl uppercase" style="left: 600px; top: 40px; width: 600px; height: 100px; border-radius: 50px;">Barra Principal</div>
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
        
        <div class="zoom-ctrl">
            <button onclick="changeZoom(0.1)" class="btn-round"><i class="fa-solid fa-plus text-sm"></i></button>
            <button onclick="changeZoom(-0.1)" class="btn-round"><i class="fa-solid fa-minus text-sm"></i></button>
            <button onclick="resetZoom()" class="btn-round"><i class="fa-solid fa-expand text-sm"></i></button>
        </div>

        <!-- Toolbar de Diseño Flotante -->
        <div id="design-toolbar">
            <span class="text-[9px] text-amber-500 font-black uppercase italic mr-2">Diseño:</span>
            <button onclick="addNewMesa()" class="bg-white/10 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase italic border border-white/20 hover:bg-white/20">
                <i class="fa-solid fa-plus mr-1"></i> Nueva Mesa
            </button>
            <button onclick="resetLayout()" class="text-white/40 px-2 py-2 font-black text-[9px] uppercase italic">Reiniciar</button>
        </div>
    </main>

    <!-- PANTALLAS DE OVERLAY -->
    <div id="notes-screen" class="screen-overlay">
        <h2 class="font-black text-xl italic uppercase mb-4 text-slate-800">Observaciones</h2>
        <textarea id="main-notes" placeholder="Escriba aquí notas generales de la auditoría..." class="w-full h-80 p-5 bg-white rounded-[2rem] border-2 border-slate-200 font-bold text-slate-600 uppercase text-xs shadow-inner"></textarea>
    </div>

    <div id="report-screen" class="screen-overlay">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-xl italic uppercase text-slate-800">Historial</h2>
            <button onclick="clearHistory()" class="text-red-500 text-[10px] font-black uppercase italic border border-red-200 px-4 py-1 rounded-full">Limpiar Todo</button>
        </div>
        <div id="history-list" class="space-y-4 pb-20"></div>
    </div>

    <!-- MODAL EDICIÓN DE MESA (Para modo diseño) -->
    <div id="edit-mesa-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden z-[600] items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8">
            <h3 class="font-black uppercase italic text-lg mb-6 text-center text-slate-900 underline decoration-red-500 decoration-4">Propiedades</h3>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="text-[9px] font-black uppercase ml-2 text-slate-400">Etiqueta</label>
                    <input id="edit-label" type="text" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black uppercase text-xs">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="setMesaProp('type', 'cuadrado')" class="p-4 bg-slate-100 rounded-2xl font-black text-[10px] uppercase italic border-2 border-transparent focus:border-slate-900">Cuadrada</button>
                    <button onclick="setMesaProp('type', 'circulo')" class="p-4 bg-slate-100 rounded-2xl font-black text-[10px] uppercase italic border-2 border-transparent focus:border-slate-900">Redonda</button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[9px] font-black uppercase ml-2 text-slate-400">Ancho</label>
                        <input id="edit-w" type="number" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-xs text-center">
                    </div>
                    <div>
                        <label class="text-[9px] font-black uppercase ml-2 text-slate-400">Alto</label>
                        <input id="edit-h" type="number" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-xs text-center">
                    </div>
                </div>
                <button onclick="deleteMesa()" class="w-full py-3 text-red-500 font-black uppercase italic text-[10px] bg-red-50 rounded-2xl border border-red-100">Eliminar Mesa</button>
            </div>
            <button onclick="saveMesaEdit()" class="w-full py-5 bg-slate-950 text-white rounded-2xl font-black uppercase italic shadow-xl mb-4">Guardar y Cerrar</button>
            <button onclick="closeModal('edit-mesa-modal')" class="w-full text-slate-400 font-black text-[10px] uppercase italic">Cancelar</button>
        </div>
    </div>

    <!-- MODAL FINALIZAR AUDITORÍA -->
    <div id="save-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden z-[500] items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-center font-black uppercase italic text-xl mb-8">Resumen Final</h3>
            <div class="space-y-5 mb-8">
                <input id="f-auditor" type="text" placeholder="NOMBRE DEL AUDITOR" class="w-full p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black uppercase text-xs">
                <input id="f-lugar" type="text" placeholder="SECTOR (EJ. BARRA, TERRAZA)" class="w-full p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black uppercase text-xs">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase ml-2 text-slate-400">In Situ</label>
                        <input id="f-fisico" type="number" placeholder="0" class="w-full p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-sm text-center">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase ml-2 text-slate-400">Micros</label>
                        <input id="f-sistema" type="number" placeholder="0" class="w-full p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-sm text-center">
                    </div>
                </div>
            </div>
            <button onclick="confirmSave()" class="w-full py-6 bg-red-600 text-white rounded-2xl font-black uppercase italic shadow-2xl shadow-red-900/40 mb-4">Guardar Reporte</button>
            <button onclick="closeModal('save-modal')" class="w-full text-slate-400 font-black text-[10px] uppercase italic">Regresar al Mapa</button>
        </div>
    </div>

    <script>
        const DB_PREFIX = 'SPOTCHECK_PROF_V6';
        let tables = [];
        let audits = JSON.parse(localStorage.getItem(`${DB_PREFIX}_audits`)) || [];
        let isDesignMode = false;
        let scale = 0.5, tx = 20, ty = 20;
        let selectedMesaId = null;

        const viewport = document.getElementById('viewport');
        const mapContainer = document.getElementById('map-container');
        const mesasLayer = document.getElementById('mesas-layer');

        function createInitialLayout() {
            const layout = [];
            // Filas de mesas estandar
            for(let i=0; i<10; i++) {
                layout.push({ id: Date.now()+i, label: `${i+1}`, x: 300 + (i*80), y: 250, w: 60, h: 60, type: 'cuadrado', status: 'free' });
                layout.push({ id: Date.now()+20+i, label: `${i+11}`, x: 300 + (i*80), y: 400, w: 60, h: 60, type: 'cuadrado', status: 'free' });
            }
            // VIPs circulares
            for(let i=0; i<5; i++) {
                layout.push({ id: Date.now()+50+i, label: `V${i+1}`, x: 100, y: 150 + (i*120), w: 90, h: 90, type: 'circulo', status: 'free' });
            }
            tables = layout;
            saveData();
        }

        function init() {
            const saved = localStorage.getItem(`${DB_PREFIX}_tables`);
            if(saved) tables = JSON.parse(saved); else createInitialLayout();
            render();
            setupPanning();
            applyTransform();
        }

        function setupPanning() {
            let isPanning = false, startX, startY;
            viewport.onpointerdown = e => {
                if (e.target.closest('.mesa')) return;
                isPanning = true;
                startX = e.clientX - tx;
                startY = e.clientY - ty;
                viewport.setPointerCapture(e.pointerId);
            };
            viewport.onpointermove = e => {
                if (!isPanning) return;
                tx = e.clientX - startX;
                ty = e.clientY - startY;
                applyTransform();
            };
            viewport.onpointerup = () => { isPanning = false; };
        }

        function render() {
            mesasLayer.innerHTML = '';
            let counts = { free: 0, occ: 0, und: 0 };
            
            tables.forEach(t => {
                counts[t.status === 'free' ? 'free' : (t.status === 'occupied' ? 'occ' : 'und')]++;
                
                const el = document.createElement('div');
                el.className = `mesa ${t.type} status-${t.status}`;
                el.style.left = `${t.x}px`;
                el.style.top = `${t.y}px`;
                el.style.width = `${t.w || 60}px`;
                el.style.height = `${t.h || 60}px`;
                el.innerText = t.label;

                // Eventos de interacción
                el.onpointerdown = (e) => {
                    e.stopPropagation();
                    if(isDesignMode) {
                        handleDrag(e, t, el);
                    } else {
                        // Cambiar estado en modo lectura
                        t.status = t.status === 'free' ? 'occupied' : (t.status === 'occupied' ? 'undefined' : 'free');
                        saveData();
                        render();
                    }
                };

                // Abrir edición en modo diseño con un clic
                el.onclick = () => {
                    if(isDesignMode) openEditModal(t);
                };

                mesasLayer.appendChild(el);
            });

            document.getElementById('c-free').innerText = counts.free;
            document.getElementById('c-occ').innerText = counts.occ;
            document.getElementById('c-und').innerText = counts.und;
        }

        function handleDrag(e, t, el) {
            let sX = e.clientX, sY = e.clientY;
            let iX = t.x, iY = t.y;
            el.classList.add('dragging');
            el.setPointerCapture(e.pointerId);
            
            const onMove = (ev) => {
                t.x = iX + (ev.clientX - sX) / scale;
                t.y = iY + (ev.clientY - sY) / scale;
                el.style.left = `${t.x}px`;
                el.style.top = `${t.y}px`;
            };
            
            const onUp = () => {
                el.classList.remove('dragging');
                saveData();
                el.removeEventListener('pointermove', onMove);
                el.removeEventListener('pointerup', onUp);
            };
            
            el.addEventListener('pointermove', onMove);
            el.addEventListener('pointerup', onUp);
        }

        function switchTab(tab) {
            // Limpiar estados
            document.querySelectorAll('.screen-overlay').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('design-toolbar').style.display = 'none';
            mapContainer.classList.remove('design-grid');
            
            isDesignMode = (tab === 'design');
            const ind = document.getElementById('mode-indicator');

            if(tab === 'map') {
                ind.innerText = "MODO LECTURA";
                ind.className = "text-[8px] font-black uppercase text-slate-400 bg-slate-100 px-2 py-1 rounded tracking-widest";
            } else if(tab === 'design') {
                document.getElementById('design-toolbar').style.display = 'flex';
                mapContainer.classList.add('design-grid');
                ind.innerText = "MODO CONSTRUCTOR (MUEVA PIEZAS)";
                ind.className = "text-[8px] font-black uppercase text-amber-600 bg-amber-100 px-2 py-1 rounded tracking-widest";
            } else {
                document.getElementById(`${tab}-screen`).classList.add('active');
                if(tab === 'report') renderHistory();
            }

            document.getElementById(`btn-${tab}`).classList.add('active');
        }

        function openEditModal(t) {
            selectedMesaId = t.id;
            document.getElementById('edit-label').value = t.label;
            document.getElementById('edit-w').value = t.w || 60;
            document.getElementById('edit-h').value = t.h || 60;
            openModal('edit-mesa-modal');
        }

        function saveMesaEdit() {
            const t = tables.find(x => x.id === selectedMesaId);
            if(t) {
                t.label = document.getElementById('edit-label').value;
                t.w = parseInt(document.getElementById('edit-w').value);
                t.h = parseInt(document.getElementById('edit-h').value);
                saveData(); render(); closeModal('edit-mesa-modal');
            }
        }

        function setMesaProp(prop, val) {
            const t = tables.find(x => x.id === selectedMesaId);
            if(t) { t[prop] = val; render(); }
        }

        function deleteMesa() {
            if(confirm("¿Eliminar esta mesa definitivamente?")) {
                tables = tables.filter(x => x.id !== selectedMesaId);
                saveData(); render(); closeModal('edit-mesa-modal');
            }
        }

        function addNewMesa() {
            const newM = {
                id: Date.now(), label: '+', x: 100 / scale, y: 100 / scale, w: 65, h: 65, type: 'cuadrado', status: 'free'
            };
            tables.push(newM);
            saveData(); render();
        }

        function confirmSave() {
            const audit = {
                id: Date.now(),
                fecha: new Date().toLocaleString(),
                auditor: document.getElementById('f-auditor').value || 'S/N',
                lugar: document.getElementById('f-lugar').value || 'GENERAL',
                insitu: document.getElementById('f-fisico').value || '0',
                micros: document.getElementById('f-sistema').value || '0',
                obs: document.getElementById('main-notes').value || 'Sin observaciones',
                u: tables.filter(t => t.status === 'undefined').length
            };
            audits.unshift(audit);
            localStorage.setItem(`${DB_PREFIX}_audits`, JSON.stringify(audits));
            closeModal('save-modal');
            switchTab('report');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="block text-[8px] font-black text-slate-300 uppercase">${a.fecha}</span>
                            <h4 class="font-black text-slate-900 text-sm uppercase italic tracking-tighter">${a.auditor}</h4>
                        </div>
                        <div class="${a.u > 0 ? 'bg-red-50 text-red-600' : 'bg-slate-50 text-slate-400'} px-3 py-1 rounded-full font-black text-[9px] uppercase italic">
                            Fallas: ${a.u}
                        </div>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400 font-bold uppercase text-[8px]">Sector:</span>
                            <span class="font-black text-slate-700 italic text-[11px] uppercase">${a.lugar}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                            <div>
                                <span class="text-slate-400 font-bold uppercase text-[7px] block">In Situ</span>
                                <span class="font-black text-slate-800 text-lg leading-none">${a.insitu}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 font-bold uppercase text-[7px] block">Micros</span>
                                <span class="font-black text-red-600 text-lg leading-none">${a.micros}</span>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-50">
                            <p class="text-[10px] text-slate-500 font-medium uppercase italic leading-tight">${a.obs}</p>
                        </div>
                    </div>
                </div>
            `).join('') || '<p class="text-center py-20 uppercase font-black text-slate-300 italic text-xs">Historial Vacío</p>';
        }

        function changeZoom(d) { scale = Math.min(Math.max(scale + d, 0.1), 3); applyTransform(); }
        function resetZoom() { scale = 0.5; tx = 20; ty = 20; applyTransform(); }
        function applyTransform() { mapContainer.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
        function saveData() { localStorage.setItem(`${DB_PREFIX}_tables`, JSON.stringify(tables)); }
        function resetLayout() { if(confirm("¿Restablecer el plano original?")) { createInitialLayout(); render(); } }
        function clearHistory() { if(confirm("¿Borrar todo el historial?")) { audits=[]; localStorage.removeItem(`${DB_PREFIX}_audits`); renderHistory(); } }
        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        window.onload = init;
    </script>
</body>
</html>
