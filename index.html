<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - CONTROL PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f1f5f9;
        }
        
        #map-container { 
            height: 1400px; 
            width: 100%;
            position: relative;
            background-color: #ffffff;
            transition: all 0.3s;
        }

        .design-grid {
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 40px 40px;
        }

        .mesa {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 20;
            touch-action: none;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.1s ease;
        }

        .area-vip {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 10;
            border: 2px dashed #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            text-transform: uppercase;
            touch-action: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            padding: 5px;
        }

        /* Estados de Auditoría */
        .item-free { background-color: #ffffff; color: #1e293b; border: 2px solid #e2e8f0; }
        .item-occupied { 
            background-color: #0f172a !important; 
            color: #ffffff !important; 
            border-color: #0f172a !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            z-index: 25;
        }

        .selected-design { 
            outline: 4px solid #3b82f6; 
            outline-offset: 4px; 
            z-index: 50 !important; 
        }

        .screen-overlay {
            position: fixed;
            left: 0; right: 0; bottom: 0; top: 0;
            background-color: #f8fafc;
            z-index: 150; overflow-y: auto; display: none;
        }
        .screen-overlay.active { display: flex; }

        #modal-save {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.98);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .btn-main {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }
        .btn-main:active { transform: scale(0.96); }

        /* Estilos de inputs de auditoría */
        .audit-input-group {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }
        .audit-label {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
            display: block;
        }
        .audit-field {
            width: 100%;
            background: transparent;
            font-weight: 800;
            font-size: 14px;
            outline: none;
            color: #0f172a;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-900">

    <!-- CABECERA -->
    <header class="bg-slate-950 text-white p-4 pt-10 flex justify-between items-center shrink-0 z-[110] shadow-xl">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg transform rotate-3">
                <i class="fa-solid fa-bolt text-sm"></i>
            </div>
            <h1 class="font-black text-lg italic tracking-tighter uppercase">SPOT CHECK</h1>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="px-4 py-2 bg-slate-900 rounded-xl border border-slate-800 flex items-center gap-2 btn-main">
            <span id="lock-text" class="text-[9px] font-bold uppercase text-slate-400">Bloqueado</span>
            <i class="fa-solid fa-lock text-red-500" id="lock-icon"></i>
        </button>
    </header>

    <!-- NAVEGACIÓN -->
    <nav class="bg-white border-b border-slate-200 p-2 flex gap-1 z-[110]">
        <button onclick="setMode('audit')" id="nav-audit" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-slate-950 text-white transition-all">Auditar</button>
        <button onclick="setMode('design')" id="nav-design" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400 transition-all">Diseño Completo</button>
        <button onclick="setMode('history')" id="nav-history" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400 transition-all">Historial</button>
    </nav>

    <!-- ÁREA DE MAPA -->
    <main class="flex-1 overflow-auto bg-slate-100 relative" id="main-scroll">
        <div id="map-container">
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
    </main>

    <!-- PANEL INFERIOR (DISEÑO) -->
    <footer id="design-footer" class="hidden p-5 bg-white border-t border-slate-200 z-[120] shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
        <div id="edit-controls" class="hidden mb-4 p-4 bg-blue-50 rounded-2xl border-2 border-blue-100 space-y-3">
            <div class="flex gap-2">
                <input id="label-input" type="text" class="flex-1 p-4 rounded-xl border-2 border-blue-200 font-bold text-base outline-none focus:border-blue-500" placeholder="Nombre...">
                <button onclick="deleteSelected()" class="bg-red-500 text-white p-4 rounded-xl w-14 btn-main shadow-lg"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-2">
            <button onclick="addTable()" class="bg-slate-900 text-white py-4 rounded-xl font-black text-[10px] uppercase italic btn-main">+ Mesa Común</button>
            <button onclick="addVIP('gran')" class="bg-blue-700 text-white py-4 rounded-xl font-black text-[10px] uppercase italic btn-main">+ VIP Mesa Larga (1x4)</button>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="addVIP('h')" class="bg-slate-200 text-slate-700 py-4 rounded-xl font-black text-[10px] uppercase italic btn-main">+ VIP Cuadrado</button>
            <button onclick="addVIP('v')" class="bg-slate-200 text-slate-700 py-4 rounded-xl font-black text-[10px] uppercase italic btn-main">+ VIP Vertical</button>
        </div>
    </footer>

    <!-- PANEL INFERIOR (AUDITORÍA) -->
    <footer id="audit-footer" class="p-6 bg-white border-t border-slate-200 z-[120] shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
        <button onclick="openSaveModal()" class="w-full bg-slate-950 text-white py-6 rounded-[2rem] font-black text-sm uppercase italic tracking-widest shadow-2xl btn-main border-b-4 border-slate-800">Finalizar Reporte</button>
    </footer>

    <!-- MODAL DE GUARDADO -->
    <div id="modal-save">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-6 space-y-4 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="text-center mb-2">
                <h3 class="text-2xl font-black italic uppercase tracking-tighter text-slate-950">Documentar</h3>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Notas de Auditoría</p>
            </div>
            
            <div class="space-y-3">
                <div class="audit-input-group">
                    <span class="audit-label">Responsable</span>
                    <input id="aud-resp" type="text" class="audit-field" placeholder="Nombre...">
                </div>
                <div class="audit-input-group">
                    <span class="audit-label">Lugar / Sector</span>
                    <input id="aud-lugar" type="text" class="audit-field" placeholder="Sector auditado...">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="audit-input-group">
                        <span class="audit-label">In Situ</span>
                        <input id="aud-insitu" type="number" class="audit-field" placeholder="0">
                    </div>
                    <div class="audit-input-group">
                        <span class="audit-label">Micros</span>
                        <input id="aud-micros" type="number" class="audit-field" placeholder="0">
                    </div>
                </div>
                <div class="audit-input-group">
                    <span class="audit-label">Observaciones</span>
                    <textarea id="aud-obs" rows="3" class="audit-field resize-none" placeholder="Novedades del campo..."></textarea>
                </div>
            </div>

            <div class="pt-2 space-y-3">
                <button onclick="confirmSave()" class="w-full bg-blue-600 text-white py-5 rounded-[2rem] font-black text-xs uppercase shadow-xl btn-main">Confirmar y Guardar</button>
                <button onclick="closeSaveModal()" class="w-full py-2 text-slate-400 font-bold text-[10px] uppercase tracking-widest text-center">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA HISTORIAL -->
    <div id="history-screen" class="screen-overlay flex-col p-6">
        <div class="flex justify-between items-center mb-8 pt-10">
            <h2 class="text-2xl font-black italic uppercase tracking-tighter">Historial de Notas</h2>
            <button onclick="setMode('audit')" class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-slate-400 shadow-sm"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div id="history-list" class="space-y-6 pb-20"></div>
    </div>

    <script>
        const DB_PREFIX = 'spotcheck_v6_final';
        let tables = JSON.parse(localStorage.getItem(`${DB_PREFIX}_tables`)) || [];
        let audits = JSON.parse(localStorage.getItem(`${DB_PREFIX}_audits`)) || [];
        let isLocked = true;
        let currentMode = 'audit';
        let selectedId = null;

        function init() {
            if (tables.length === 0) resetLayout();
            render();
            window.addEventListener('pointerup', () => { if(currentMode === 'design') saveData(); });
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            const container = document.getElementById('map-container');
            layer.innerHTML = '';
            container.className = currentMode === 'design' ? 'design-grid' : '';

            tables.forEach(t => {
                const el = document.createElement('div');
                const isOccupied = t.occupied;
                
                if (t.type === 'vip') {
                    el.className = `area-vip ${isOccupied ? 'item-occupied' : 'item-free'} ${selectedId === t.id && currentMode === 'design' ? 'selected-design' : ''}`;
                    el.style.width = t.w + 'px';
                    el.style.height = t.h + 'px';
                } else {
                    el.className = `mesa ${isOccupied ? 'item-occupied' : 'item-free'} ${selectedId === t.id && currentMode === 'design' ? 'selected-design' : ''}`;
                }
                
                el.style.left = t.x + '%';
                el.style.top = t.y + '%';
                el.innerText = t.label;

                // Soporte para pintar en modo auditoría (VIP y Mesas)
                el.onclick = (e) => {
                    if (currentMode === 'audit') {
                        t.occupied = !t.occupied;
                        saveData();
                        render();
                    }
                };

                // Soporte para arrastre en modo diseño
                el.onpointerdown = (e) => {
                    if (currentMode === 'design' && !isLocked) {
                        selectedId = t.id;
                        updateEditPanel();
                        startDragging(e, t, el);
                    }
                };

                layer.appendChild(el);
            });
        }

        function startDragging(e, t, el) {
            const rect = document.getElementById('map-container').getBoundingClientRect();
            function moveAt(clientX, clientY) {
                let newX = ((clientX - rect.left) / rect.width) * 100;
                let newY = ((clientY - rect.top) / rect.height) * 100;
                t.x = Math.max(2, Math.min(98, newX));
                t.y = Math.max(1, Math.min(99, newY));
                el.style.left = t.x + '%';
                el.style.top = t.y + '%';
            }
            function onMove(ev) { moveAt(ev.clientX, ev.clientY); }
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', () => {
                window.removeEventListener('pointermove', onMove);
                saveData();
                render();
            }, { once: true });
        }

        function setMode(m) {
            currentMode = m; selectedId = null;
            document.querySelectorAll('nav button').forEach(b => b.className = "flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400 transition-all");
            document.getElementById(`nav-${m}`).className = "flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-slate-950 text-white shadow-xl transition-all";
            
            document.getElementById('design-footer').classList.toggle('hidden', m !== 'design');
            document.getElementById('audit-footer').classList.toggle('hidden', m !== 'audit');
            document.getElementById('history-screen').classList.toggle('active', m === 'history');
            
            if (m === 'history') renderHistory();
            updateEditPanel();
            render();
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500' : 'fa-solid fa-unlock text-blue-500';
            document.getElementById('lock-text').innerText = isLocked ? 'Bloqueado' : 'Editor Activo';
            updateEditPanel();
            render();
        }

        function updateEditPanel() {
            const controls = document.getElementById('edit-controls');
            const item = tables.find(t => t.id === selectedId);
            if (selectedId && currentMode === 'design' && !isLocked) {
                controls.classList.remove('hidden');
                document.getElementById('label-input').value = item.label;
                document.getElementById('label-input').oninput = (e) => { item.label = e.target.value; render(); };
            } else {
                controls.classList.add('hidden');
            }
        }

        function addTable() {
            tables.push({ id: Date.now(), x: 50, y: 50, label: (tables.filter(t=>t.type!=='vip').length + 1).toString(), type: 'mesa', occupied: false });
            render(); saveData();
        }

        function addVIP(type) {
            let w = 120, h = 120, label = "VIP";
            if(type === 'v') { w = 80; h = 160; }
            if(type === 'gran') { w = 240; h = 60; label = "MESA LARGA VIP"; } // Proporción 1x4 aproximada
            
            tables.push({ id: Date.now(), x: 50, y: 30, label: label, type: 'vip', w, h, occupied: false });
            render(); saveData();
        }

        function deleteSelected() {
            tables = tables.filter(t => t.id !== selectedId);
            selectedId = null; updateEditPanel(); render(); saveData();
        }

        function openSaveModal() { document.getElementById('modal-save').style.display = 'flex'; }
        function closeSaveModal() { document.getElementById('modal-save').style.display = 'none'; }

        function confirmSave() {
            const auditData = {
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                resp: document.getElementById('aud-resp').value || 'Sin nombre',
                lugar: document.getElementById('aud-lugar').value || 'Sin sector',
                insitu: document.getElementById('aud-insitu').value || '0',
                micros: document.getElementById('aud-micros').value || '0',
                obs: document.getElementById('aud-obs').value || '',
                perc: 0
            };

            const total = tables.length;
            const occ = tables.filter(t => t.occupied).length;
            auditData.perc = total > 0 ? Math.round((occ/total)*100) : 0;
            
            audits.unshift(auditData);
            tables.forEach(t => t.occupied = false);
            saveData();
            closeSaveModal();
            setMode('history');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2.5 h-full bg-slate-900"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">${a.date} · ${a.time}</p>
                            <p class="font-black text-sm uppercase text-slate-950">${a.resp}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-black text-blue-600 leading-none">${a.perc}%</p>
                            <p class="text-[7px] font-black uppercase text-blue-400 mt-1 italic">Ocupación</p>
                        </div>
                    </div>
                    
                    <!-- SECCION NOTAS Y DETALLES -->
                    <div class="space-y-3 border-t border-slate-100 pt-4">
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-bold text-slate-400 uppercase">Sector:</span>
                            <span class="text-[11px] font-black uppercase text-slate-700 italic">${a.lugar}</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <span class="audit-label" style="margin-bottom:0">In Situ</span>
                                <span class="font-black text-slate-900">${a.insitu}</span>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <span class="audit-label" style="margin-bottom:0">Micros</span>
                                <span class="font-black text-slate-900">${a.micros}</span>
                            </div>
                        </div>

                        ${a.obs ? `
                        <div class="mt-2 p-3 bg-blue-50/50 rounded-2xl border border-blue-100/50">
                             <span class="audit-label">Observaciones</span>
                             <p class="text-[11px] text-slate-600 italic font-medium leading-relaxed">${a.obs}</p>
                        </div>` : ''}
                    </div>
                </div>
            `).join('') || '<p class="text-center py-20 text-slate-300 font-black uppercase text-[10px]">No hay reportes guardados</p>';
        }

        function resetLayout() {
            tables = [
                { id: 1, x: 20, y: 15, label: "1", type: 'mesa', occupied: false },
                { id: 2, x: 40, y: 15, label: "2", type: 'mesa', occupied: false },
                { id: 3, x: 50, y: 50, label: "MESA LARGA VIP", type: 'vip', w: 240, h: 60, occupied: false }
            ];
            saveData();
        }

        function saveData() {
            localStorage.setItem(`${DB_PREFIX}_tables`, JSON.stringify(tables));
            localStorage.setItem(`${DB_PREFIX}_audits`, JSON.stringify(audits));
        }

        init();
    </script>
</body>
</html>
