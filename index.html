<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - CONTROL PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f1f5f9;
        }
        
        /* Contenedor del mapa optimizado para scroll */
        #map-container { 
            height: 1200px; 
            width: 100%;
            position: relative;
            background-color: #ffffff;
            transition: all 0.3s;
        }

        .design-grid {
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }

        .mesa {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 20;
            touch-action: none;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .area-vip {
            position: absolute;
            z-index: 10;
            border: 3px dashed #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            color: #1d4ed8;
            touch-action: none;
            border-radius: 8px;
        }

        .mesa-free { background-color: #ffffff; color: #1e293b; border: 2px solid #e2e8f0; }
        .mesa-occupied { 
            background-color: #0f172a !important; 
            color: #ffffff !important; 
            transform: translate(-50%, -50%) scale(1.1);
        }

        .selected-design { 
            outline: 3px solid #3b82f6; 
            outline-offset: 4px; 
            z-index: 50 !important; 
        }

        .screen-overlay {
            position: fixed;
            left: 0; right: 0; bottom: 0; top: 0;
            background-color: #f8fafc;
            z-index: 100; overflow-y: auto; display: none;
        }
        .screen-overlay.active { display: flex; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-900">

    <!-- CABECERA -->
    <header class="bg-slate-950 text-white p-4 pt-8 flex justify-between items-center shrink-0 z-[110]">
        <div class="flex items-center gap-2">
            <h1 class="font-black text-lg italic tracking-tighter">SPOT CHECK</h1>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="px-4 py-2 bg-slate-900 rounded-xl border border-slate-800 flex items-center gap-2">
            <span id="lock-text" class="text-[10px] font-bold uppercase">Bloqueado</span>
            <i class="fa-solid fa-lock text-red-500" id="lock-icon"></i>
        </button>
    </header>

    <!-- NAVEGACIÓN -->
    <nav class="bg-white border-b border-slate-200 p-2 flex gap-1 z-[110]">
        <button onclick="setMode('audit')" id="nav-audit" class="flex-1 py-2 rounded-lg font-bold text-[11px] uppercase bg-slate-100">Auditar</button>
        <button onclick="setMode('design')" id="nav-design" class="flex-1 py-2 rounded-lg font-bold text-[11px] uppercase">Diseño</button>
        <button onclick="setMode('history')" id="nav-history" class="flex-1 py-2 rounded-lg font-bold text-[11px] uppercase">Histo</button>
    </nav>

    <!-- MAPA -->
    <main class="flex-1 overflow-auto bg-slate-200 relative" id="main-scroll">
        <div id="map-container" class="">
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
    </main>

    <!-- PANEL DE EDICIÓN (Solo se ve en Diseño) -->
    <footer id="design-footer" class="hidden p-4 bg-white border-t border-slate-300 z-[120]">
        <div id="edit-controls" class="hidden mb-4 p-4 bg-blue-50 rounded-2xl border border-blue-100 space-y-3">
            <div class="flex gap-2">
                <input id="label-input" type="text" class="flex-1 p-3 rounded-xl border border-blue-200 font-bold" placeholder="Nombre/Número">
                <button onclick="deleteSelected()" class="bg-red-500 text-white p-3 rounded-xl w-12"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div id="vip-resize" class="hidden flex gap-2">
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-blue-600 block mb-1 uppercase">Ancho (%)</label>
                    <input id="width-input" type="number" class="w-full p-2 rounded-lg border border-blue-200 font-bold">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-blue-600 block mb-1 uppercase">Alto (%)</label>
                    <input id="height-input" type="number" class="w-full p-2 rounded-lg border border-blue-200 font-bold">
                </div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="addTable()" class="flex-1 bg-slate-900 text-white py-4 rounded-xl font-bold text-xs uppercase">+ Mesa</button>
            <button onclick="addVIPArea()" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold text-xs uppercase">+ VIP</button>
        </div>
    </footer>

    <footer id="audit-footer" class="p-4 bg-white border-t border-slate-300 z-[120]">
        <button onclick="saveAudit()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-xs uppercase">Finalizar Reporte</button>
    </footer>

    <!-- PANTALLA HISTORIAL -->
    <div id="history-screen" class="screen-overlay flex-col p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black italic">HISTORIAL</h2>
            <button onclick="setMode('audit')" class="text-slate-400"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <div id="history-list" class="space-y-3"></div>
    </div>

    <script>
        const DB_KEY = 'spotcheck_final_v1';
        let tables = JSON.parse(localStorage.getItem(`${DB_KEY}_tables`)) || [];
        let audits = JSON.parse(localStorage.getItem(`${DB_KEY}_audits`)) || [];
        let isLocked = true;
        let currentMode = 'audit';
        let selectedId = null;

        function init() {
            if (tables.length === 0) {
                tables = [{ id: 1, x: 50, y: 10, label: "1", type: "mesa", occupied: false }];
            }
            render();
            window.addEventListener('pointerup', () => { saveData(); });
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            const container = document.getElementById('map-container');
            layer.innerHTML = '';
            
            container.className = currentMode === 'design' ? 'design-grid' : '';

            tables.forEach(t => {
                const el = document.createElement('div');
                if (t.type === 'vip') {
                    el.className = `area-vip ${selectedId === t.id && currentMode === 'design' ? 'selected-design' : ''}`;
                    el.style.width = (t.w || 20) + '%';
                    el.style.height = (t.h || 10) + '%';
                } else {
                    el.className = `mesa ${t.occupied ? 'mesa-occupied' : 'mesa-free'} ${selectedId === t.id && currentMode === 'design' ? 'selected-design' : ''}`;
                }
                
                el.style.left = t.x + '%';
                el.style.top = t.y + '%';
                el.innerText = t.label;

                // Eventos
                el.onpointerdown = (e) => {
                    if (currentMode === 'design' && !isLocked) {
                        selectedId = t.id;
                        updateEditPanel();
                        startDragging(e, t, el);
                    }
                };

                el.onclick = () => {
                    if (currentMode === 'audit' && t.type !== 'vip') {
                        t.occupied = !t.occupied;
                        saveData();
                        render();
                    }
                };

                layer.appendChild(el);
            });
        }

        function startDragging(e, t, el) {
            const rect = document.getElementById('map-container').getBoundingClientRect();
            const shiftX = e.clientX - el.getBoundingClientRect().left - el.offsetWidth/2;
            const shiftY = e.clientY - el.getBoundingClientRect().top - el.offsetHeight/2;

            function moveAt(clientX, clientY) {
                let newX = ((clientX - rect.left) / rect.width) * 100;
                let newY = ((clientY - rect.top) / rect.height) * 100;
                t.x = Math.max(5, Math.min(95, newX));
                t.y = Math.max(2, Math.min(98, newY));
                el.style.left = t.x + '%';
                el.style.top = t.y + '%';
            }

            function onPointerMove(ev) { moveAt(ev.clientX, ev.clientY); }
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', () => {
                window.removeEventListener('pointermove', onPointerMove);
                render();
            }, { once: true });
        }

        function setMode(m) {
            currentMode = m;
            selectedId = null;
            document.getElementById('nav-audit').className = m === 'audit' ? 'flex-1 py-2 rounded-lg font-bold text-[11px] uppercase bg-slate-900 text-white' : 'flex-1 py-2 rounded-lg font-bold text-[11px] uppercase bg-slate-100';
            document.getElementById('nav-design').className = m === 'design' ? 'flex-1 py-2 rounded-lg font-bold text-[11px] uppercase bg-slate-900 text-white' : 'flex-1 py-2 rounded-lg font-bold text-[11px] uppercase bg-slate-100';
            
            document.getElementById('design-footer').classList.toggle('hidden', m !== 'design');
            document.getElementById('audit-footer').classList.toggle('hidden', m !== 'audit');
            document.getElementById('history-screen').classList.toggle('active', m === 'history');
            
            if (m === 'history') renderHistory();
            updateEditPanel();
            render();
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500' : 'fa-solid fa-unlock text-blue-500';
            document.getElementById('lock-text').innerText = isLocked ? 'Bloqueado' : 'Editor';
            updateEditPanel();
            render();
        }

        function updateEditPanel() {
            const controls = document.getElementById('edit-controls');
            const vipResize = document.getElementById('vip-resize');
            const item = tables.find(t => t.id === selectedId);

            if (selectedId && currentMode === 'design' && !isLocked) {
                controls.classList.remove('hidden');
                document.getElementById('label-input').value = item.label;
                document.getElementById('label-input').oninput = (e) => { item.label = e.target.value; render(); };
                
                if (item.type === 'vip') {
                    vipResize.classList.remove('hidden');
                    document.getElementById('width-input').value = item.w || 20;
                    document.getElementById('height-input').value = item.h || 10;
                    document.getElementById('width-input').oninput = (e) => { item.w = e.target.value; render(); };
                    document.getElementById('height-input').oninput = (e) => { item.h = e.target.value; render(); };
                } else {
                    vipResize.classList.add('hidden');
                }
            } else {
                controls.classList.add('hidden');
            }
        }

        function addTable() {
            tables.push({ id: Date.now(), x: 50, y: 50, label: (tables.length + 1).toString(), type: 'mesa', occupied: false });
            render();
        }

        function addVIPArea() {
            tables.push({ id: Date.now(), x: 30, y: 30, label: 'VIP', type: 'vip', w: 30, h: 15 });
            render();
        }

        function deleteSelected() {
            tables = tables.filter(t => t.id !== selectedId);
            selectedId = null;
            updateEditPanel();
            render();
        }

        function saveAudit() {
            const occ = tables.filter(t => t.occupied && t.type !== 'vip').length;
            const total = tables.filter(t => t.type !== 'vip').length;
            audits.unshift({
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                perc: total > 0 ? Math.round((occ/total)*100) : 0
            });
            tables.forEach(t => t.occupied = false);
            saveData();
            setMode('history');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">${a.date} - ${a.time}</p>
                        <p class="text-lg font-black text-blue-600">${a.perc}% OCUPACIÓN</p>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 py-10 font-bold uppercase text-xs">Sin registros</p>';
        }

        function saveData() {
            localStorage.setItem(`${DB_KEY}_tables`, JSON.stringify(tables));
            localStorage.setItem(`${DB_KEY}_audits`, JSON.stringify(audits));
        }

        init();
    </script>
</body>
</html>
