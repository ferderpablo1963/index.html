<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPOT CHECK CONTROL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #10b981;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-container { 
            display: flex; 
            background: #ffffff; 
            padding: 10px; 
            gap: 8px; 
            border-bottom: 1px solid #e2e8f0;
            z-index: 1000; 
        }
        .nav-btn {
            flex: 1; padding: 12px 4px; border-radius: 16px; color: #94a3b8;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s;
        }
        .nav-btn.active { background: #f8fafc; color: var(--primary); border: 1px solid #e2e8f0; }
        .nav-btn.active i { color: var(--accent); }

        .screen { flex: 1; display: none; overflow: hidden; position: relative; }
        .screen.active { display: flex; flex-direction: column; }

        #viewport {
            flex: 1;
            background: #cbd5e1;
            overflow: auto;
            position: relative;
            padding: 40px 20px;
            display: block;
            touch-action: none;
        }

        #map-canvas { 
            width: 1000px; 
            height: 1500px; 
            background: white;
            position: relative; 
            border-radius: 1rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 25px 25px;
            margin: 0 auto;
        }

        .mesa {
            position: absolute;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 14px; user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 12px;
            z-index: 10;
            touch-action: none;
            cursor: move;
        }
        .mesa-disponible { background: white; border: 2px solid #cbd5e1; color: #64748b; }
        .mesa-ocupada { background: #0f172a; border: 2px solid #0f172a; color: #10b981; }
        .mesa-discrepante { background: #ef4444; border: 2px solid #b91c1c; color: white; }

        .resize-handle {
            position: absolute; 
            right: -12px; 
            bottom: -12px;
            width: 36px; 
            height: 36px; 
            background: #3b82f6;
            border: 3px solid white; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: white; 
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn-delete {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .floating-action-container {
            position: fixed;
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            width: 90%;
            max-width: 400px;
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .report-card {
            background: white; padding: 20px; border-radius: 24px;
            border: 1px solid #e2e8f0; margin-bottom: 12px;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8);
            display: none; align-items: center; justify-content: center; z-index: 3000;
            padding: 20px; backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <header class="bg-slate-950 p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-layer-group text-slate-900"></i>
            </div>
            <div>
                <h1 class="text-white font-black text-xs uppercase leading-none">Spot Check Control</h1>
                <p class="text-[8px] text-emerald-500 font-bold tracking-widest uppercase">Gerencia Corporativa</p>
            </div>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-black border border-slate-700">
            <i id="lock-icon" class="fa-solid fa-lock text-red-500 mr-1"></i> <span id="lock-text">BLOQUEADO</span>
        </button>
    </header>

    <nav class="nav-container">
        <button onclick="setTab('design')" id="nav-design" class="nav-btn active"><i class="fa-solid fa-pencil text-lg"></i>Diseño</button>
        <button onclick="setTab('audit')" id="nav-audit" class="nav-btn"><i class="fa-solid fa-clipboard-list text-lg"></i>Auditoría</button>
        <button onclick="setTab('notes')" id="nav-notes" class="nav-btn"><i class="fa-solid fa-check-double text-lg"></i>Finalizar</button>
        <button onclick="setTab('reports')" id="nav-reports" class="nav-btn"><i class="fa-solid fa-chart-pie text-lg"></i>Reportes</button>
    </nav>

    <!-- PANTALLA: DISEÑO -->
    <section id="screen-design" class="screen active">
        <div id="viewport" onclick="deselectAll(event)">
            <div id="map-canvas">
                <div id="layer-design" class="w-full h-full relative"></div>
            </div>
        </div>
        <div id="design-controls" class="hidden floating-action-container">
            <div class="flex gap-2">
                <button onclick="confirmReset()" class="bg-red-600 text-white p-4 rounded-2xl font-black text-sm uppercase shadow-2xl border-4 border-white/20 active:scale-95 transition-transform flex items-center justify-center">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <button onclick="addTable()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black text-sm uppercase shadow-2xl border-4 border-white/20 active:scale-95 transition-transform">
                    <i class="fa-solid fa-plus-circle mr-2"></i> Agregar Mesa
                </button>
            </div>
        </div>
    </section>

    <!-- PANTALLA: AUDITORÍA -->
    <section id="screen-audit" class="screen">
        <div id="viewport">
            <div id="map-canvas">
                <div id="layer-audit" class="w-full h-full relative"></div>
            </div>
        </div>
        <div class="floating-action-container">
            <button onclick="setTab('notes')" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-sm uppercase shadow-2xl active:scale-95 transition-transform">
                Confirmar y Ver Resumen
            </button>
        </div>
    </section>

    <!-- PANTALLA: FINALIZAR -->
    <section id="screen-notes" class="screen overflow-y-auto p-6 bg-slate-50">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 max-w-md mx-auto mb-20">
            <h2 class="text-[10px] font-black uppercase text-slate-400 mb-6 tracking-widest border-b pb-2">Información del Reporte</h2>
            <div class="space-y-4">
                <input type="text" id="lugar-sector" placeholder="SECTOR / SALÓN" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold uppercase outline-none focus:border-blue-500">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="mesas-insitu" placeholder="FÍSICO" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold">
                    <input type="number" id="mesas-micros" placeholder="MICROS" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold">
                </div>
                <input type="text" id="firma-auditor" placeholder="AUDITOR" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold uppercase">
                <button onclick="saveFinalReport()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black uppercase text-xs mt-4">
                    Guardar Reporte Oficial
                </button>
            </div>
        </div>
    </section>

    <!-- PANTALLA: REPORTES -->
    <section id="screen-reports" class="screen overflow-y-auto p-6 bg-slate-50">
        <div id="report-list" class="max-w-md mx-auto pb-24"></div>
    </section>

    <!-- MODAL CONFIRMACIÓN RESET -->
    <div id="reset-modal" class="modal">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            </div>
            <h3 class="font-black text-slate-900 uppercase text-sm mb-2">¿Borrar diseño?</h3>
            <p class="text-xs text-slate-500 mb-6">Se eliminarán todas las mesas del mapa actual. Esta acción no se puede deshacer.</p>
            <div class="flex flex-col gap-2">
                <button onclick="resetCanvas()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase text-[10px]">Confirmar Reset</button>
                <button onclick="closeResetModal()" class="w-full bg-slate-100 text-slate-500 py-4 rounded-xl font-black uppercase text-[10px]">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLE -->
    <div id="report-modal" class="modal" onclick="closeModal(event)">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
            <div id="modal-content-inner"></div>
            <button onclick="closeModal()" class="w-full mt-6 bg-slate-100 py-4 rounded-xl font-bold text-slate-600">Cerrar</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-40 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full font-black text-[10px] opacity-0 transition-all z-[3000] pointer-events-none"></div>

    <script>
        let tables = JSON.parse(localStorage.getItem('sp_control_tables')) || [];
        let reports = JSON.parse(localStorage.getItem('sp_control_reports')) || [];
        let auditStatus = {}; 
        let isLocked = true;
        let selectedId = null;
        let currentTab = 'design';

        function init() {
            renderAll();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
            if(tab === 'reports') renderReports();
            renderAll();
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500 mr-1' : 'fa-solid fa-unlock text-emerald-500 mr-1';
            document.getElementById('lock-text').innerText = isLocked ? 'BLOQUEADO' : 'EDITANDO';
            document.getElementById('design-controls').classList.toggle('hidden', isLocked);
            selectedId = null;
            renderAll();
        }

        function confirmReset() {
            document.getElementById('reset-modal').classList.add('active');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.remove('active');
        }

        function resetCanvas() {
            tables = [];
            auditStatus = {};
            selectedId = null;
            save();
            renderAll();
            closeResetModal();
            showToast("MAPA RESETEADO");
        }

        function addTable() {
            const viewport = document.getElementById('viewport');
            const scrollX = viewport.scrollLeft;
            const scrollY = viewport.scrollTop;
            
            const newTable = {
                id: 'id_' + Date.now(),
                x: scrollX + 100,
                y: scrollY + 100,
                w: 80,
                h: 80,
                label: (tables.length + 1).toString()
            };
            tables.push(newTable);
            selectedId = newTable.id;
            save();
            renderAll();
            showToast("MESA AGREGADA");
        }

        function save() {
            localStorage.setItem('sp_control_tables', JSON.stringify(tables));
        }

        function renderAll() {
            renderMap('layer-design', false);
            renderMap('layer-audit', true);
        }

        function renderMap(layerId, isAudit) {
            const layer = document.getElementById(layerId);
            if (!layer) return;
            layer.innerHTML = '';

            tables.forEach(t => {
                const div = document.createElement('div');
                const status = auditStatus[t.id] || 0;
                
                div.className = `mesa ${isAudit ? (status === 1 ? 'mesa-ocupada' : (status === 2 ? 'mesa-discrepante' : 'mesa-disponible')) : 'mesa-disponible'}`;
                if(!isAudit && selectedId === t.id && !isLocked) {
                    div.style.border = '4px solid #3b82f6';
                    div.style.zIndex = '100';
                }
                
                div.style.left = t.x + 'px'; 
                div.style.top = t.y + 'px';
                div.style.width = t.w + 'px'; 
                div.style.height = t.h + 'px';
                div.innerText = t.label;

                if (isAudit) {
                    div.onclick = (e) => { 
                        e.stopPropagation();
                        auditStatus[t.id] = (status + 1) % 3;
                        renderMap(layerId, true); 
                    };
                } else {
                    div.onpointerdown = (e) => {
                        if(isLocked) return;
                        if(e.target.closest('.resize-handle') || e.target.closest('.btn-delete')) return;
                        
                        selectedId = t.id;
                        renderAll();

                        const startX = e.clientX;
                        const startY = e.clientY;
                        const initialX = t.x;
                        const initialY = t.y;

                        div.setPointerCapture(e.pointerId);

                        div.onpointermove = (em) => {
                            t.x = initialX + (em.clientX - startX);
                            t.y = initialY + (em.clientY - startY);
                            div.style.left = t.x + 'px';
                            div.style.top = t.y + 'px';
                        };

                        div.onpointerup = () => {
                            div.onpointermove = null;
                            div.releasePointerCapture(e.pointerId);
                            save();
                        };
                    };

                    if (selectedId === t.id && !isLocked) {
                        const btnDel = document.createElement('div');
                        btnDel.className = 'btn-delete';
                        btnDel.innerHTML = '<i class="fa-solid fa-times"></i>';
                        btnDel.onclick = (e) => {
                            e.stopPropagation();
                            tables = tables.filter(x => x.id !== t.id);
                            selectedId = null;
                            save();
                            renderAll();
                        };
                        div.appendChild(btnDel);

                        const handle = document.createElement('div');
                        handle.className = 'resize-handle';
                        handle.innerHTML = '<i class="fa-solid fa-expand"></i>';
                        handle.onpointerdown = (e) => {
                            e.stopPropagation();
                            const sW = t.w;
                            const sH = t.h;
                            const sX = e.clientX;
                            const sY = e.clientY;
                            
                            handle.setPointerCapture(e.pointerId);
                            handle.onpointermove = (em) => {
                                t.w = Math.max(40, sW + (em.clientX - sX));
                                t.h = Math.max(40, sH + (em.clientY - sY));
                                div.style.width = t.w + 'px';
                                div.style.height = t.h + 'px';
                            };
                            handle.onpointerup = () => {
                                handle.onpointermove = null;
                                save();
                            };
                        };
                        div.appendChild(handle);
                    }
                }
                layer.appendChild(div);
            });
        }

        function deselectAll(e) {
            if(e.target.id === 'viewport' || e.target.id === 'map-canvas' || e.target.id === 'layer-design') {
                selectedId = null;
                renderAll();
            }
        }

        function saveFinalReport() {
            let o = 0, d = 0, l = 0;
            tables.forEach(t => {
                const s = auditStatus[t.id] || 0;
                if(s === 1) o++; else if(s === 2) d++; else l++;
            });

            const r = {
                id: Date.now(),
                sector: document.getElementById('lugar-sector').value || "Sector Sin Nombre",
                situ: document.getElementById('mesas-insitu').value || 0,
                micros: document.getElementById('mesas-micros').value || 0,
                mapOcupadas: o,
                mapIndefinidas: d,
                mapLibres: l,
                total: tables.length,
                fecha: new Date().toLocaleDateString(),
                hora: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            };
            reports.unshift(r);
            localStorage.setItem('sp_control_reports', JSON.stringify(reports));
            showToast("REPORTE GUARDADO");
            setTab('reports');
        }

        function renderReports() {
            const list = document.getElementById('report-list');
            list.innerHTML = reports.map(r => `
                <div class="report-card" onclick="showReportDetail(${r.id})">
                    <div class="flex justify-between text-[9px] font-black text-slate-400 mb-2">
                        <span>${r.fecha}</span>
                        <span>${r.hora}</span>
                    </div>
                    <h3 class="font-black text-slate-900 uppercase mb-4 text-sm">${r.sector}</h3>
                    <div class="flex gap-2">
                        <div class="flex-1 bg-slate-900 text-white p-3 rounded-2xl text-center">
                            <p class="text-[7px] font-bold text-emerald-400 uppercase">Ocupadas</p>
                            <p class="text-xs font-black">${r.mapOcupadas}</p>
                        </div>
                        <div class="flex-1 bg-red-500 text-white p-3 rounded-2xl text-center">
                            <p class="text-[7px] font-bold uppercase">Diferencias</p>
                            <p class="text-xs font-black">${r.mapIndefinidas}</p>
                        </div>
                        <div class="flex-1 bg-slate-100 p-3 rounded-2xl text-center">
                            <p class="text-[7px] font-bold text-slate-400 uppercase">Total</p>
                            <p class="text-xs font-black">${r.total}</p>
                        </div>
                    </div>
                </div>
            `).join('') || '<div class="text-center py-20"><i class="fa-solid fa-folder-open text-slate-200 text-5xl mb-4"></i><p class="text-slate-400 font-bold uppercase text-[10px]">Sin reportes guardados</p></div>';
        }

        function showReportDetail(id) {
            const r = reports.find(x => x.id === id);
            const diff = Number(r.situ) - Number(r.micros);
            document.getElementById('modal-content-inner').innerHTML = `
                <h2 class="text-lg font-black uppercase text-slate-900">${r.sector}</h2>
                <p class="text-[10px] font-bold text-emerald-500 mb-6">${r.fecha} - ${r.hora}</p>
                
                <div class="space-y-3">
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">Capacidad Salón:</span>
                        <span class="font-black">${r.total} Mesas</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">Ocupación Mapa:</span>
                        <span class="font-black text-emerald-600">${r.mapOcupadas}</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">Alertas:</span>
                        <span class="font-black text-red-500">${r.mapIndefinidas}</span>
                    </div>
                    <div class="mt-6 p-5 bg-slate-950 rounded-3xl text-white shadow-xl">
                        <div class="flex justify-between mb-1">
                            <span class="text-[10px] font-bold uppercase text-slate-500">Lectura Física:</span>
                            <span class="font-black text-lg">${r.situ}</span>
                        </div>
                        <div class="flex justify-between mb-2">
                            <span class="text-[10px] font-bold uppercase text-slate-500">Lectura Micros:</span>
                            <span class="font-black text-lg">${r.micros}</span>
                        </div>
                        <div class="flex justify-between pt-3 border-t border-white/10 mt-2">
                            <span class="text-xs font-black text-emerald-400 uppercase">Diferencia Neta:</span>
                            <span class="text-2xl font-black ${diff != 0 ? 'text-red-400' : 'text-emerald-400'}">${diff}</span>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('report-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('report-modal').classList.remove('active'); }

        function showToast(m) { 
            const t = document.getElementById('toast'); 
            t.innerText = m; 
            t.style.opacity = '1'; 
            t.style.transform = 'translate(-50%, -10px)';
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translate(-50%, 0)';
            }, 2000); 
        }

        window.onload = init;
    </script>
</body>
</html>
