<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - SUPER APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f1f5f9;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        #map-wrapper {
            flex: 1;
            width: 100%;
            overflow: auto;
            position: relative;
            background-color: #cbd5e1;
            cursor: grab;
        }
        #map-wrapper:active { cursor: grabbing; }
        #map-wrapper::-webkit-scrollbar { display: none; }

        #map-container { 
            height: 3000px; 
            width: 3000px; 
            position: relative;
            background-color: #ffffff;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
        }

        .design-grid {
            background-image: 
                linear-gradient(to right, #f1f5f9 2px, transparent 2px),
                linear-gradient(to bottom, #f1f5f9 2px, transparent 2px);
            background-size: 50px 50px;
        }

        .mesa, .area-vip {
            position: absolute;
            z-index: 20;
            touch-action: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, border 0.2s, transform 0.1s;
        }

        .mesa { border-radius: 14px; border: 2px solid #e2e8f0; font-size: 14px; }
        .area-vip { border: 3px dashed #94a3b8; border-radius: 20px; text-transform: uppercase; font-size: 18px; }

        .item-free { background-color: #ffffff; color: #1e293b; }
        .item-doubt { background-color: #fbbf24 !important; color: #000000 !important; border: 3px solid #d97706 !important; }
        .item-occupied { background-color: #020617 !important; color: #ffffff !important; border-color: #020617 !important; }

        .selected-design { 
            outline: 4px solid #3b82f6; 
            outline-offset: 4px; 
            z-index: 50 !important; 
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .zoom-controls {
            position: fixed;
            right: 20px;
            top: 40%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 300;
        }

        .btn-zoom {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            color: #0f172a;
            border: 1px solid #e2e8f0;
            font-size: 20px;
        }

        /* PANEL DE CREACIÓN SUPER VISIBLE */
        .layout-console {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 400;
            width: 90%;
            max-width: 400px;
            background: #020617;
            padding: 15px;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .layout-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: white;
            font-weight: 900;
            font-size: 10px;
            text-transform: uppercase;
        }

        .layout-btn-icon {
            width: 50px;
            height: 50px;
            background: #2563eb;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 2px;
        }

        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 24px); }
    </style>
</head>
<body class="text-slate-900">

    <!-- HEADER -->
    <header class="bg-slate-950 text-white p-4 pt-10 flex justify-between items-center shrink-0 z-[500] shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center rotate-3 shadow-lg">
                <i class="fa-solid fa-bolt-lightning text-white"></i>
            </div>
            <div>
                <h1 class="font-black text-lg italic uppercase leading-tight">SPOT CHECK</h1>
                <p class="text-[8px] text-blue-400 font-bold tracking-widest uppercase">Layout & Control</p>
            </div>
        </div>
        
        <!-- Panel de edición rápida -->
        <div id="design-edit-top" class="hidden flex items-center gap-2 bg-blue-600 p-2 rounded-2xl shadow-lg">
            <input id="label-input" type="text" class="w-12 bg-white/20 text-white font-black outline-none rounded-lg text-sm text-center py-1" maxlength="5">
            <div class="flex gap-1 h-8">
                <button onclick="changeSize(10)" class="w-8 bg-blue-500 rounded-lg flex items-center justify-center"><i class="fa-solid fa-plus text-[10px]"></i></button>
                <button onclick="changeSize(-10)" class="w-8 bg-blue-500 rounded-lg flex items-center justify-center"><i class="fa-solid fa-minus text-[10px]"></i></button>
                <button onclick="rotateSelected()" class="w-8 bg-blue-500 rounded-lg flex items-center justify-center"><i class="fa-solid fa-rotate"></i></button>
                <button onclick="deleteSelected()" class="w-8 bg-red-500 rounded-lg flex items-center justify-center"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
            </div>
        </div>

        <button onclick="toggleLock()" id="lock-btn" class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center border border-slate-800 transition-all">
            <i class="fa-solid fa-lock text-red-500 text-lg" id="lock-icon"></i>
        </button>
    </header>

    <!-- NAVIGATION -->
    <nav class="bg-white border-b border-slate-200 p-2 flex gap-2 z-[450] shrink-0">
        <button onclick="setMode('audit')" id="nav-audit" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-slate-950 text-white">Control</button>
        <button onclick="setMode('design')" id="nav-design" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400">Layout</button>
        <button onclick="setMode('history')" id="nav-history" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400">Reportes</button>
    </nav>

    <!-- MAP VIEW -->
    <main class="flex-1 relative overflow-hidden" id="main-view">
        
        <!-- Controles de Zoom -->
        <div class="zoom-controls">
            <button onclick="applyZoom(0.1)" class="btn-zoom"><i class="fa-solid fa-plus"></i></button>
            <button onclick="resetZoom()" class="btn-zoom"><i class="fa-solid fa-expand"></i></button>
            <button onclick="applyZoom(-0.1)" class="btn-zoom"><i class="fa-solid fa-minus"></i></button>
        </div>

        <!-- CONSOLA DE LAYOUT (BOTONES PARA AGREGAR MESAS) -->
        <div id="layout-console" class="layout-console hidden">
            <button onclick="addTable()" class="layout-btn">
                <div class="layout-btn-icon"><i class="fa-solid fa-plus"></i></div>
                <span>Mesa</span>
            </button>
            <button onclick="addVIP()" class="layout-btn">
                <div class="layout-btn-icon bg-purple-600"><i class="fa-solid fa-vector-square"></i></div>
                <span>Sector VIP</span>
            </button>
            <button onclick="toggleLock()" class="layout-btn">
                <div class="layout-btn-icon bg-emerald-600"><i class="fa-solid fa-check"></i></div>
                <span>Listo</span>
            </button>
        </div>

        <div id="map-wrapper">
            <div id="map-container" class="design-grid">
                <div id="mesas-layer" class="w-full h-full relative"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER AUDIT -->
    <footer id="audit-footer" class="p-4 bg-white border-t border-slate-200 z-[450] safe-bottom shrink-0">
        <button onclick="openSaveModal()" class="w-full bg-slate-950 text-white py-5 rounded-[2rem] font-black text-xs uppercase tracking-widest active:scale-95 transition-all shadow-xl">
            Finalizar y Guardar Reporte
        </button>
    </footer>

    <!-- MODALES Y PANTALLAS (Sin cambios mayores en lógica, solo diseño) -->
    <div id="modal-save" class="fixed inset-0 bg-slate-950/95 z-[1000] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 space-y-6 shadow-2xl">
            <h3 class="text-2xl font-black uppercase text-center italic tracking-tighter">Cerrar Auditoría</h3>
            <div class="space-y-3">
                <input id="aud-resp" type="text" class="w-full p-4 bg-slate-100 rounded-2xl font-bold border-2 border-transparent focus:border-blue-500 outline-none" placeholder="Auditor">
                <input id="aud-lugar" type="text" class="w-full p-4 bg-slate-100 rounded-2xl font-bold border-2 border-transparent focus:border-blue-500 outline-none" placeholder="Sector/Lugar">
                <div class="grid grid-cols-2 gap-3">
                    <input id="aud-insitu" type="number" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none" placeholder="Pax">
                    <input id="aud-micros" type="number" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none" placeholder="Micros">
                </div>
            </div>
            <button onclick="confirmSave()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase shadow-lg shadow-blue-200">Guardar Ahora</button>
            <button onclick="closeSaveModal()" class="w-full text-slate-400 font-bold uppercase text-[10px] text-center">Volver</button>
        </div>
    </div>

    <div id="history-screen" class="fixed inset-0 bg-slate-50 z-[900] hidden flex-col p-6 overflow-y-auto pt-24">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-black uppercase italic tracking-tighter text-slate-950">Reportes</h2>
            <button onclick="setMode('audit')" class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center border border-slate-200"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="history-list" class="space-y-4 pb-40"></div>
    </div>

    <script>
        const DB_KEY = 'SPOTCHECK_FINAL_V2';
        let tables = JSON.parse(localStorage.getItem(`${DB_KEY}_tables`)) || [];
        let audits = JSON.parse(localStorage.getItem(`${DB_KEY}_audits`)) || [];
        let currentMode = 'audit';
        let isLocked = true;
        let selectedId = null;
        let zoomLevel = 0.8;

        let isPanning = false;
        let startX, startY, scrollLeft, scrollTop;

        function init() {
            if (tables.length === 0) {
                tables = [
                    { id: 1, x: 100, y: 100, label: "01", type: 'mesa', status: 'free', w: 80, h: 80 },
                    { id: 2, x: 250, y: 100, label: "02", type: 'mesa', status: 'free', w: 80, h: 80 }
                ];
            }
            initPanControls();
            render();
            updateUI();
        }

        function initPanControls() {
            const wrapper = document.getElementById('map-wrapper');
            wrapper.addEventListener('mousedown', (e) => {
                if (e.target.id !== 'map-wrapper' && e.target.id !== 'map-container' && e.target.id !== 'mesas-layer') return;
                isPanning = true;
                startX = e.pageX - wrapper.offsetLeft;
                startY = e.pageY - wrapper.offsetTop;
                scrollLeft = wrapper.scrollLeft;
                scrollTop = wrapper.scrollTop;
            });
            wrapper.addEventListener('mouseleave', () => isPanning = false);
            wrapper.addEventListener('mouseup', () => isPanning = false);
            wrapper.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                e.preventDefault();
                const x = e.pageX - wrapper.offsetLeft;
                const y = e.pageY - wrapper.offsetTop;
                wrapper.scrollLeft = scrollLeft - (x - startX);
                wrapper.scrollTop = scrollTop - (y - startY);
            });
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            const container = document.getElementById('map-container');
            layer.innerHTML = '';
            
            container.style.transform = `scale(${zoomLevel})`;
            container.className = (currentMode === 'design' && !isLocked) ? 'design-grid' : '';

            tables.forEach(t => {
                const el = document.createElement('div');
                let statusClass = t.status === 'doubt' ? 'item-doubt' : (t.status === 'occupied' ? 'item-occupied' : 'item-free');
                const baseClass = t.type === 'vip' ? 'area-vip' : 'mesa';
                const selectClass = (selectedId === t.id && currentMode === 'design') ? 'selected-design' : '';
                
                el.className = `${baseClass} ${statusClass} ${selectClass}`;
                el.style.width = t.w + 'px'; el.style.height = t.h + 'px';
                el.style.left = t.x + 'px'; el.style.top = t.y + 'px';
                el.innerText = t.label;

                el.onclick = (e) => {
                    e.stopPropagation();
                    if (currentMode === 'audit') {
                        if (!t.status || t.status === 'free') t.status = 'doubt';
                        else if (t.status === 'doubt') t.status = 'occupied';
                        else t.status = 'free';
                        save(); render();
                    } else if (currentMode === 'design' && !isLocked) {
                        selectedId = t.id; updateUI(); render();
                    }
                };

                if (currentMode === 'design' && !isLocked) {
                    el.onpointerdown = (e) => { e.stopPropagation(); selectedId = t.id; updateUI(); startDragging(e, t, el); };
                }
                layer.appendChild(el);
            });
        }

        function startDragging(e, t, el) {
            const container = document.getElementById('map-container');
            const rect = container.getBoundingClientRect();
            const moveHandler = (ev) => {
                t.x = ((ev.clientX - rect.left) / zoomLevel) - (t.w / 2);
                t.y = ((ev.clientY - rect.top) / zoomLevel) - (t.h / 2);
                el.style.left = t.x + 'px'; el.style.top = t.y + 'px';
            };
            const stopHandler = () => {
                window.removeEventListener('pointermove', moveHandler);
                window.removeEventListener('pointerup', stopHandler);
                save(); render();
            };
            window.addEventListener('pointermove', moveHandler);
            window.addEventListener('pointerup', stopHandler);
        }

        function applyZoom(delta) { zoomLevel = Math.max(0.1, Math.min(2, zoomLevel + delta)); render(); }
        function resetZoom() { zoomLevel = 0.8; render(); }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500 text-lg' : 'fa-solid fa-unlock text-blue-500 text-lg';
            setMode(currentMode);
        }

        function setMode(m) {
            currentMode = m;
            selectedId = null;
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('bg-slate-950', 'text-white');
                b.classList.add('text-slate-400');
            });
            document.getElementById(`nav-${m}`).classList.add('bg-slate-950', 'text-white');
            
            document.getElementById('audit-footer').classList.toggle('hidden', m !== 'audit');
            document.getElementById('layout-console').classList.toggle('hidden', m !== 'design' || isLocked);
            document.getElementById('history-screen').classList.toggle('hidden', m !== 'history');
            
            if(m === 'history') renderHistory();
            updateUI(); render();
        }

        function updateUI() {
            const panel = document.getElementById('design-edit-top');
            const item = tables.find(t => t.id === selectedId);
            if (selectedId && currentMode === 'design' && !isLocked) {
                panel.classList.remove('hidden');
                const input = document.getElementById('label-input');
                input.value = item.label;
                input.oninput = (e) => { item.label = e.target.value.toUpperCase(); render(); save(); };
            } else { panel.classList.add('hidden'); }
        }

        function addTable() {
            const wrapper = document.getElementById('map-wrapper');
            const newT = { id: Date.now(), x: wrapper.scrollLeft + 100, y: wrapper.scrollTop + 100, label: (tables.length + 1).toString().padStart(2, '0'), type: 'mesa', status: 'free', w: 80, h: 80 };
            tables.push(newT); selectedId = newT.id; save(); render(); updateUI();
        }

        function addVIP() {
            const wrapper = document.getElementById('map-wrapper');
            const newV = { id: Date.now(), x: wrapper.scrollLeft + 100, y: wrapper.scrollTop + 100, label: "VIP", type: 'vip', status: 'free', w: 250, h: 120 };
            tables.push(newV); selectedId = newV.id; save(); render(); updateUI();
        }

        function changeSize(delta) {
            const t = tables.find(x => x.id === selectedId);
            if (t) { t.w = Math.max(40, t.w + delta); t.h = Math.max(40, t.h + delta); render(); save(); }
        }
        function rotateSelected() {
            const t = tables.find(x => x.id === selectedId);
            if(t) { [t.w, t.h] = [t.h, t.w]; render(); save(); }
        }
        function deleteSelected() {
            if(confirm("¿Eliminar?")) { tables = tables.filter(t => t.id !== selectedId); selectedId = null; save(); render(); updateUI(); }
        }

        function openSaveModal() { document.getElementById('modal-save').style.display = 'flex'; }
        function closeSaveModal() { document.getElementById('modal-save').style.display = 'none'; }

        function confirmSave() {
            const report = {
                id: Date.now(),
                resp: document.getElementById('aud-resp').value || 'User',
                lugar: document.getElementById('aud-lugar').value || 'Salón',
                insitu: document.getElementById('aud-insitu').value || 0,
                micros: document.getElementById('aud-micros').value || 0,
                date: new Date().toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}),
                occ: tables.filter(t => t.status === 'occupied').length, total: tables.length
            };
            audits.unshift(report);
            tables.forEach(t => t.status = 'free');
            save(); closeSaveModal(); setMode('history');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm flex justify-between items-center border border-slate-100">
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase">${a.date}</p>
                        <p class="font-black text-lg text-slate-900">${a.resp}</p>
                        <p class="text-[9px] font-bold text-blue-600 uppercase">${a.lugar} · Pax: ${parseInt(a.insitu) + parseInt(a.micros)}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-3xl font-black text-slate-950">${Math.round((a.occ/a.total)*100)}%</span>
                        <p class="text-[8px] font-black text-slate-400 uppercase">Ocupación</p>
                    </div>
                </div>
            `).join('') || '<div class="text-center py-20 text-slate-300 font-black uppercase text-xs">Sin registros</div>';
        }

        function save() {
            localStorage.setItem(`${DB_KEY}_tables`, JSON.stringify(tables));
            localStorage.setItem(`${DB_KEY}_audits`, JSON.stringify(audits));
        }

        window.onload = init;
    </script>
</body>
</html>
