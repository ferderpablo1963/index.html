<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPOT CHECK - Versión Local</title>
    <!-- Tailwind para el diseño y FontAwesome para los iconos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            background-color: #f8fafc; 
        }
        /* Contenedor del mapa con scroll */
        #map-container { 
            height: 1200px; 
            width: 150%; 
            position: relative; 
            background-color: #ffffff; 
            border-radius: 2.5rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }
        /* Estilo de las mesas */
        .mesa {
            position: absolute; 
            transform: translate(-50%, -50%);
            width: 55px; 
            height: 55px; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: 900; 
            font-size: 0.85rem; 
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
            touch-action: none;
        }
        .mesa-libre { 
            background: white; 
            border: 2px solid #e2e8f0; 
            color: #1e293b; 
        }
        .mesa-ocupada { 
            background: #0f172a; 
            border: 2px solid #0f172a; 
            color: #10b981; 
            transform: translate(-50%, -50%) scale(1.1); 
            box-shadow: 0 10px 15px rgba(15, 23, 42, 0.3); 
        }
        /* Cuadrícula para modo diseño */
        .design-grid { 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px); 
            background-size: 30px 30px; 
        }
        .dragging { 
            opacity: 0.6; 
            z-index: 100; 
            border: 2px dashed #3b82f6 !important; 
            transform: translate(-50%, -50%) scale(1.2) !important; 
        }
        .screen-overlay { 
            position: fixed; 
            inset: 0; 
            top: 160px; 
            background: #f8fafc; 
            z-index: 40; 
            display: none; 
            overflow-y: auto; 
            padding-bottom: 120px; 
        }
        .screen-overlay.active { display: block; }
        #toast { 
            position: fixed; 
            bottom: 120px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            display: none; 
        }
        /* Scrollbar estética */
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none text-slate-900">

    <!-- CABECERA -->
    <header class="bg-slate-950 text-white p-5 pt-12 flex justify-between items-center shrink-0 shadow-2xl z-[60]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                <i class="fa-solid fa-bolt text-slate-950 text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black italic tracking-tighter leading-none">SPOT CHECK</h1>
                <p class="text-[9px] uppercase font-bold tracking-[0.2em] text-emerald-400">Versión Local Pro</p>
            </div>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="bg-slate-900 px-4 py-2 rounded-xl text-[10px] font-black border border-slate-800 transition-all active:scale-95 flex items-center gap-2">
            <i id="lock-icon" class="fa-solid fa-lock text-red-500"></i>
            <span id="lock-text" class="text-slate-300">BLOQUEADO</span>
        </button>
    </header>

    <!-- NAVEGACIÓN -->
    <nav class="bg-white border-b border-slate-200 p-2 flex gap-1 shrink-0 z-50 shadow-sm">
        <button onclick="setTab('map')" id="btn-map" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-slate-50 text-slate-950 border-b-2 border-emerald-500 transition-all">Auditoría</button>
        <button onclick="setTab('history')" id="btn-history" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-slate-400 transition-all">Historial</button>
        <button onclick="setTab('config')" id="btn-config" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-slate-400 transition-all">Ajustes</button>
    </nav>

    <!-- ÁREA DE MAPA -->
    <main id="map-screen" class="flex-1 overflow-auto bg-slate-100 relative p-4 custom-scroll">
        <div id="map-container">
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
    </main>

    <!-- PANTALLA HISTORIAL -->
    <div id="history-screen" class="screen-overlay p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xs font-black uppercase text-slate-400 tracking-widest">Registros Guardados</h2>
            <button onclick="clearHistory()" class="text-[9px] font-black text-red-400 uppercase bg-red-50 px-3 py-1.5 rounded-lg">Borrar Todo</button>
        </div>
        <div id="history-list" class="space-y-4"></div>
    </div>

    <!-- PANTALLA AJUSTES -->
    <div id="config-screen" class="screen-overlay p-6">
        <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm max-w-md mx-auto">
            <h3 class="font-black text-slate-950 uppercase italic text-lg mb-2">Editor de Plano</h3>
            <p class="text-[10px] text-slate-400 mb-8 uppercase font-black tracking-wider">Desbloquea el candado arriba para mover mesas o cambiar etiquetas.</p>
            
            <div id="edit-box" class="hidden mb-8 p-5 bg-slate-50 rounded-3xl border border-slate-100 space-y-4">
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase mb-2 block">Nombre/Nº de Mesa</label>
                    <input id="label-input" type="text" class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-4 font-black outline-none focus:border-emerald-500 transition-all text-lg">
                </div>
                <button onclick="deleteSelected()" class="w-full bg-red-50 text-red-500 py-4 rounded-2xl font-black text-[10px] uppercase flex items-center justify-center gap-2 border border-red-100">
                    <i class="fa-solid fa-trash"></i> Eliminar Seleccionada
                </button>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="addTable()" class="w-full bg-slate-950 text-white py-5 rounded-3xl font-black text-xs uppercase shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
                    <i class="fa-solid fa-plus text-emerald-400"></i> Añadir Mesa
                </button>
                <button onclick="resetLayout()" class="w-full py-4 text-slate-300 font-black text-[9px] uppercase tracking-[0.3em]">Resetear Plano Original</button>
            </div>
        </div>
    </div>

    <!-- FOOTER ACCIONES -->
    <footer id="footer-actions" class="p-6 bg-white border-t border-slate-200 flex gap-3 shrink-0 z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
        <button onclick="finishAudit()" class="flex-[4] bg-slate-950 text-white py-5 rounded-[2rem] font-black text-sm uppercase shadow-2xl flex items-center justify-center gap-3 active:bg-emerald-600 transition-all">
            <i class="fa-solid fa-check-double text-emerald-400"></i> Finalizar Reporte
        </button>
        <button onclick="clearCurrentSelection()" class="flex-1 bg-slate-100 text-slate-400 py-5 rounded-[2rem] flex items-center justify-center active:bg-red-50 active:text-red-400 transition-all">
            <i class="fa-solid fa-trash-can"></i>
        </button>
    </footer>

    <!-- TOAST -->
    <div id="toast" class="bg-slate-900 text-white px-8 py-4 rounded-full text-[10px] font-black uppercase shadow-2xl border border-slate-700">
        MENSAJE
    </div>

    <script>
        // --- ESTADO INICIAL ---
        let tables = JSON.parse(localStorage.getItem('sc_tables')) || [];
        let audits = JSON.parse(localStorage.getItem('sc_history')) || [];
        let localOccupied = {}; // Solo persiste durante la sesión de auditoría actual
        
        let isLocked = true;
        let currentTab = 'map';
        let selectedId = null;
        let draggingId = null;
        let startPos = { x: 0, y: 0 };
        let startMesaPos = { x: 0, y: 0 };

        // --- INICIALIZACIÓN ---
        function init() {
            if (tables.length === 0) {
                // Crear plano por defecto si está vacío
                tables = Array.from({length: 12}, (_, i) => ({
                    id: Date.now() + i,
                    x: 20 + (i % 3) * 30,
                    y: 10 + Math.floor(i / 3) * 15,
                    label: (i + 1).toString()
                }));
                saveTables();
            }
            render();
            renderHistory();
        }

        // --- RENDERIZADO ---
        function render() {
            const layer = document.getElementById('mesas-layer');
            const container = document.getElementById('map-container');
            if(!layer) return;
            
            layer.innerHTML = '';
            container.classList.toggle('design-grid', currentTab === 'config');

            tables.forEach(t => {
                const isOcc = localOccupied[t.id] || false;
                const div = document.createElement('div');
                div.className = `mesa ${isOcc ? 'mesa-ocupada' : 'mesa-libre'} ${selectedId === t.id && currentTab === 'config' ? 'ring-4 ring-emerald-400 ring-offset-4' : ''}`;
                div.style.left = `${t.x}%`;
                div.style.top = `${t.y}%`;
                div.innerText = t.label;

                // Evento Clic (Auditoría)
                div.onclick = () => {
                    if (currentTab === 'map') {
                        localOccupied[t.id] = !localOccupied[t.id];
                        render();
                    }
                };

                // Eventos Arrastre (Diseño)
                div.onpointerdown = (e) => {
                    if (currentTab === 'config' && !isLocked) {
                        e.stopPropagation();
                        draggingId = t.id;
                        selectedId = t.id;
                        startPos = { x: e.clientX, y: e.clientY };
                        startMesaPos = { x: t.x, y: t.y };
                        div.classList.add('dragging');
                        document.getElementById('edit-box').classList.remove('hidden');
                        document.getElementById('label-input').value = t.label;
                        render();
                    }
                };

                layer.appendChild(div);
            });
        }

        // --- LÓGICA DE MOVIMIENTO (Puntero/Touch) ---
        window.addEventListener('pointermove', (e) => {
            if (!draggingId) return;
            const dx = e.clientX - startPos.x;
            const dy = e.clientY - startPos.y;
            const rect = document.getElementById('map-container').getBoundingClientRect();
            const t = tables.find(x => x.id === draggingId);
            if (t) {
                // Convertir pixeles a porcentaje relativo al contenedor
                t.x = Math.max(5, Math.min(95, startMesaPos.x + (dx / rect.width * 100)));
                t.y = Math.max(2, Math.min(98, startMesaPos.y + (dy / rect.height * 100)));
                render();
            }
        });

        window.addEventListener('pointerup', () => {
            if (draggingId) {
                draggingId = null;
                saveTables();
                showToast("Posición guardada");
            }
        });

        // --- ACCIONES ---
        function setTab(tab) {
            currentTab = tab;
            selectedId = null;
            document.getElementById('edit-box').classList.add('hidden');
            
            document.getElementById('map-screen').style.display = tab === 'map' ? 'block' : 'none';
            document.getElementById('history-screen').classList.toggle('active', tab === 'history');
            document.getElementById('config-screen').classList.toggle('active', tab === 'config');
            document.getElementById('footer-actions').classList.toggle('hidden', tab !== 'map');
            
            const btns = ['map', 'history', 'config'];
            btns.forEach(b => {
                document.getElementById(`btn-${b}`).className = `flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${tab === b ? 'bg-slate-50 text-slate-950 border-b-2 border-emerald-500' : 'text-slate-400'}`;
            });
            render();
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500' : 'fa-solid fa-unlock text-emerald-400';
            document.getElementById('lock-text').innerText = isLocked ? 'BLOQUEADO' : 'EDICIÓN';
            document.getElementById('lock-text').className = isLocked ? 'text-slate-300' : 'text-emerald-400';
            showToast(isLocked ? "Plano Protegido" : "Modo Edición Activo");
        }

        function addTable() {
            if(isLocked) return showToast("Desbloquea el candado primero");
            const newMesa = { 
                id: Date.now(), 
                x: 50, 
                y: 5, 
                label: (tables.length + 1).toString() 
            };
            tables.push(newMesa);
            saveTables();
            render();
            showToast("Mesa Añadida");
        }

        function deleteSelected() {
            if(!selectedId) return;
            tables = tables.filter(t => t.id !== selectedId);
            selectedId = null;
            document.getElementById('edit-box').classList.add('hidden');
            saveTables();
            render();
        }

        document.getElementById('label-input').oninput = (e) => {
            if(selectedId) {
                const t = tables.find(x => x.id === selectedId);
                if(t) { 
                    t.label = e.target.value; 
                    saveTables();
                    render(); 
                }
            }
        };

        function finishAudit() {
            const auditor = prompt("Tu nombre (Auditor):");
            if (!auditor) return;

            const occupiedCount = Object.values(localOccupied).filter(v => v).length;
            const total = tables.length;
            const percent = total > 0 ? Math.round((occupiedCount / total) * 100) : 0;

            const newReport = {
                id: Date.now(),
                user: auditor.toUpperCase(),
                result: `${occupiedCount}/${total}`,
                percent: percent,
                date: new Date().toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
            };

            audits.unshift(newReport);
            localStorage.setItem('sc_history', JSON.stringify(audits));
            
            // Limpiar selección actual tras guardar
            localOccupied = {};
            render();
            renderHistory();
            showToast("Reporte Guardado");
            setTab('history');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(r => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex justify-between items-center relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-2 ${r.percent > 70 ? 'bg-red-500' : 'bg-emerald-500'}"></div>
                    <div>
                        <p class="font-black text-xs text-slate-900 leading-none mb-1">${r.user}</p>
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">${r.date}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black ${r.percent > 70 ? 'text-red-500' : 'text-emerald-500'} text-xl leading-none">${r.percent}%</p>
                        <p class="text-[9px] text-slate-400 font-black uppercase mt-1 italic">Ocupación</p>
                    </div>
                </div>
            `).join('') || '<div class="py-20 text-center font-black text-slate-300 text-[10px] uppercase">No hay reportes aún</div>';
        }

        function clearHistory() {
            if(confirm("¿Seguro quieres borrar todo el historial?")) {
                audits = [];
                localStorage.setItem('sc_history', JSON.stringify(audits));
                renderHistory();
            }
        }

        function clearCurrentSelection() {
            localOccupied = {};
            render();
            showToast("Marcado Limpiado");
        }

        function resetLayout() {
            if(confirm("¿Restablecer el diseño original?")) {
                localStorage.removeItem('sc_tables');
                location.reload();
            }
        }

        function saveTables() {
            localStorage.setItem('sc_tables', JSON.stringify(tables));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        // Arrancar
        init();
    </script>
</body>
</html>
