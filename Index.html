<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta tags críticos para comportamiento de App nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SPOT CHECK - Auditoría</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #10b981;
            --bg-app: #f8fafc;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-app);
            overflow: hidden; /* Evita el rebote de toda la página */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Ocultar barras de scroll pero permitir scroll funcional */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* Contenedor principal del mapa */
        #viewport {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #e2e8f0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* El "Papel" del plano */
        #map-canvas { 
            min-width: 800px;
            min-height: 1000px;
            position: relative; 
            background-color: #ffffff; 
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        /* Estilo de las mesas */
        .mesa {
            position: absolute; 
            transform: translate(-50%, -50%);
            width: 60px; 
            height: 60px; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: 800; 
            font-size: 0.9rem; 
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            user-select: none;
            border: 3px solid transparent;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mesa-libre { 
            background: white; 
            border-color: #f1f5f9; 
            color: #475569; 
        }

        .mesa-ocupada { 
            background: #0f172a; 
            border-color: #0f172a; 
            color: #10b981; 
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 12px 20px rgba(15, 23, 42, 0.3); 
        }

        .design-mode .mesa {
            border: 2px dashed #3b82f6;
        }

        /* Grilla de diseño */
        .grid-bg {
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 40px 40px;
        }

        /* Animación para el Toast */
        #toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* Overlay de Pantallas */
        .screen-overlay {
            position: fixed;
            inset: 0;
            top: 140px;
            background: var(--bg-app);
            z-index: 100;
            display: none;
            overflow-y: auto;
            padding-bottom: 120px;
        }
        .screen-overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- HEADER PRO -->
    <header class="bg-slate-950 text-white p-6 pt-12 flex justify-between items-center shadow-xl z-[200]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                <i class="fa-solid fa-location-dot text-slate-950"></i>
            </div>
            <div>
                <h1 class="text-xl font-black italic tracking-tighter leading-none uppercase">SPOT CHECK</h1>
                <p class="text-[8px] uppercase font-bold tracking-[0.2em] text-emerald-400 mt-1">Audit System v2.0</p>
            </div>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="bg-slate-900 border border-slate-800 p-3 rounded-2xl active:scale-90 transition-all">
            <i id="lock-icon" class="fa-solid fa-lock text-red-500 text-lg"></i>
        </button>
    </header>

    <!-- TABS SUPERIORES -->
    <nav class="bg-white border-b border-slate-200 p-2 flex gap-1 z-[150] shadow-sm">
        <button onclick="setTab('map')" id="btn-map" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-slate-50 border-b-2 border-emerald-500 text-slate-950">Mapa</button>
        <button onclick="setTab('history')" id="btn-history" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-slate-400">Historial</button>
        <button onclick="setTab('config')" id="btn-config" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-slate-400">Ajustes</button>
    </nav>

    <!-- AREA DEL MAPA -->
    <main id="viewport" class="bg-slate-200">
        <div id="map-canvas">
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
    </main>

    <!-- HISTORIAL -->
    <section id="history-screen" class="screen-overlay p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xs font-black uppercase text-slate-400 tracking-widest">Reportes Guardados</h2>
            <button onclick="clearHistory()" class="text-[9px] font-black text-red-500 bg-red-50 px-4 py-2 rounded-xl">Limpiar</button>
        </div>
        <div id="history-list" class="space-y-4"></div>
    </section>

    <!-- AJUSTES / DISEÑO -->
    <section id="config-screen" class="screen-overlay p-6">
        <div class="max-w-md mx-auto bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
            <h3 class="font-black text-slate-900 uppercase italic mb-6">Editor de Ambiente</h3>
            
            <div id="edit-box" class="hidden mb-6 p-5 bg-slate-50 rounded-3xl border border-slate-100 space-y-4">
                <input id="label-input" type="text" placeholder="Nombre Mesa" class="w-full p-4 rounded-2xl border-2 border-slate-200 font-black text-center text-lg outline-none focus:border-emerald-500">
                <button onclick="deleteSelected()" class="w-full py-4 text-red-500 font-black text-[10px] uppercase">Eliminar Mesa</button>
            </div>

            <div class="space-y-3">
                <button onclick="addTable()" class="w-full bg-slate-950 text-white py-5 rounded-3xl font-black text-xs uppercase flex items-center justify-center gap-3">
                    <i class="fa-solid fa-plus text-emerald-400"></i> Añadir Mesa Nueva
                </button>
                <button onclick="resetLayout()" class="w-full py-4 text-slate-400 font-black text-[9px] uppercase tracking-widest">Resetear Todo el Plano</button>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer id="footer-actions" class="fixed bottom-0 left-0 right-0 p-6 bg-white border-t border-slate-100 flex gap-3 z-[200]">
        <button onclick="finishAudit()" class="flex-[4] bg-slate-950 text-white py-5 rounded-[2rem] font-black text-sm uppercase shadow-2xl active:bg-emerald-600">
            Finalizar Reporte
        </button>
        <button onclick="clearCurrentSelection()" class="flex-1 bg-slate-100 text-slate-400 py-5 rounded-[2rem] active:bg-red-50 active:text-red-500">
            <i class="fa-solid fa-trash-can"></i>
        </button>
    </footer>

    <!-- TOAST -->
    <div id="toast" class="bg-slate-900 text-white px-8 py-4 rounded-full text-[10px] font-black uppercase shadow-2xl">
        MENSAJE
    </div>

    <script>
        let tables = JSON.parse(localStorage.getItem('sc_tables')) || [];
        let audits = JSON.parse(localStorage.getItem('sc_history')) || [];
        let localOccupied = {}; 
        let isLocked = true;
        let currentTab = 'map';
        let selectedId = null;
        let draggingId = null;
        let startPos = { x: 0, y: 0 };
        let startMesaPos = { x: 0, y: 0 };

        function init() {
            if (tables.length === 0) {
                tables = Array.from({length: 10}, (_, i) => ({
                    id: Date.now() + i,
                    x: 15 + (i % 5) * 15,
                    y: 10 + Math.floor(i / 5) * 10,
                    label: (i + 1).toString()
                }));
                saveTables();
            }
            render();
            renderHistory();
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            const canvas = document.getElementById('map-canvas');
            if(!layer) return;
            
            layer.innerHTML = '';
            canvas.className = currentTab === 'config' ? 'grid-bg' : '';

            tables.forEach(t => {
                const isOcc = localOccupied[t.id] || false;
                const div = document.createElement('div');
                div.className = `mesa ${isOcc ? 'mesa-ocupada' : 'mesa-libre'} ${selectedId === t.id && currentTab === 'config' ? 'ring-4 ring-emerald-400' : ''}`;
                div.style.left = `${t.x}%`;
                div.style.top = `${t.y}%`;
                div.innerText = t.label;

                div.onclick = (e) => {
                    if (currentTab === 'map') {
                        localOccupied[t.id] = !localOccupied[t.id];
                        render();
                    }
                };

                div.onpointerdown = (e) => {
                    if (currentTab === 'config' && !isLocked) {
                        e.stopPropagation();
                        draggingId = t.id;
                        selectedId = t.id;
                        startPos = { x: e.clientX, y: e.clientY };
                        startMesaPos = { x: t.x, y: t.y };
                        document.getElementById('edit-box').classList.remove('hidden');
                        document.getElementById('label-input').value = t.label;
                        render();
                    }
                };
                layer.appendChild(div);
            });
        }

        window.addEventListener('pointermove', (e) => {
            if (!draggingId) return;
            const dx = e.clientX - startPos.x;
            const dy = e.clientY - startPos.y;
            const rect = document.getElementById('map-canvas').getBoundingClientRect();
            const t = tables.find(x => x.id === draggingId);
            if (t) {
                t.x = Math.max(5, Math.min(95, startMesaPos.x + (dx / rect.width * 100)));
                t.y = Math.max(5, Math.min(95, startMesaPos.y + (dy / rect.height * 100)));
                render();
            }
        });

        window.addEventListener('pointerup', () => {
            if (draggingId) {
                draggingId = null;
                saveTables();
            }
        });

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('history-screen').classList.toggle('active', tab === 'history');
            document.getElementById('config-screen').classList.toggle('active', tab === 'config');
            document.getElementById('footer-actions').classList.toggle('hidden', tab !== 'map');
            
            const btns = ['map', 'history', 'config'];
            btns.forEach(b => {
                document.getElementById(`btn-${b}`).className = `flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${tab === b ? 'bg-slate-50 text-slate-950 border-b-2 border-emerald-500' : 'text-slate-400'}`;
            });
            render();
        }

        function toggleLock() {
            isLocked = !isLocked;
            const icon = document.getElementById('lock-icon');
            icon.className = isLocked ? 'fa-solid fa-lock text-red-500 text-lg' : 'fa-solid fa-unlock text-emerald-400 text-lg';
            showToast(isLocked ? "Diseño Bloqueado" : "Modo Edición Activado");
        }

        function finishAudit() {
            const auditor = prompt("Nombre del Auditor:");
            if (!auditor) return;
            const occ = Object.values(localOccupied).filter(v => v).length;
            const newReport = {
                id: Date.now(),
                user: auditor.toUpperCase(),
                percent: Math.round((occ / tables.length) * 100),
                date: new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }) + " " + new Date().toLocaleDateString()
            };
            audits.unshift(newReport);
            localStorage.setItem('sc_history', JSON.stringify(audits));
            localOccupied = {};
            render();
            renderHistory();
            setTab('history');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(r => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex justify-between items-center">
                    <div>
                        <p class="font-black text-xs text-slate-900">${r.user}</p>
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">${r.date}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-emerald-500 text-xl">${r.percent}%</p>
                    </div>
                </div>
            `).join('') || '<div class="py-20 text-center text-slate-300 font-black text-[10px] uppercase">Sin reportes</div>';
        }

        function clearHistory() { if(confirm("¿Borrar todo?")) { audits = []; localStorage.setItem('sc_history', JSON.stringify(audits)); renderHistory(); } }
        function clearCurrentSelection() { localOccupied = {}; render(); showToast("Plano Limpio"); }
        function saveTables() { localStorage.setItem('sc_tables', JSON.stringify(tables)); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
        function addTable() { if(isLocked) return; tables.push({id:Date.now(), x:50, y:50, label:(tables.length+1).toString()}); render(); }
        function deleteSelected() { tables = tables.filter(t => t.id !== selectedId); selectedId = null; saveTables(); render(); }
        
        document.getElementById('label-input').oninput = (e) => {
            const t = tables.find(x => x.id === selectedId);
            if(t) { t.label = e.target.value; render(); saveTables(); }
        };

        init();
    </script>
</body>
</html>
